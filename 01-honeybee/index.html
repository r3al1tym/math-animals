<!doctype html>
<html><head><meta charset="utf-8"><title>Math-Animals 2: the honeybee and its comb</title>
<style>html,body{margin:0;background:#1b1712}body{min-height:100vh;display:flex;align-items:center;justify-content:center}canvas{display:block;width:720px;height:900px}</style>
</head><body><canvas id="c" width="1080" height="1350"></canvas>
<script>
// ===== math-animals kit v1 begin =====

// seen from straight above and lit by one window at the upper left. Its floor is a card mount; the

// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing h px above the card throws its shadow h*K px along SH, and the
// higher it is the softer the shadow. MM is the drawer's true scale.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, MM = 3.6; // px per millimetre across the whole drawer
const SHC = 'rgb(44,30,20)'; // shadows multiply a warm brown into the card, so they stay warm and never go grey

// ---------- the drawer: oak rails, inner walls in depth, glass edge ----------
const RIM = 40, FRONT = 40, WALLV = 24, WALL_H = 22 * MM; // WALL_H: the drawer wall stands 22 mm above the card
const FX0 = RIM + WALLV, FY0 = RIM + WALLV, FX1 = W - RIM - WALLV, FY1 = H - FRONT - WALLV; // the floor
const OAK = { dark: hex('#3a2617'), mid: hex('#6b4628'), light: hex('#9a6c40') };
function _oakAt(n1, n2, n3, u, v, piece) {
  const wv = v + 6 * fbm(n1, u * 0.004 + piece, piece, 3) + 1.5 * n2(u * 0.02, piece);
  const stripe = 0.5 + 0.5 * Math.sin(wv * 1.9 + 3 * n2(wv * 0.08, u * 0.003 + piece));
  const col = mix(OAK.dark, OAK.mid, clamp(0.42 + fbm(n2, wv * 0.05 + piece, u * 0.006, 3) * 0.9 + stripe * 0.16));
  const fleck = smooth(0.38, 0.62, n3(u * 0.045 + piece, wv * 0.32)) * smooth(0.05, 0.35, n1(u * 0.012 + piece, wv * 0.05)); // ray fleck

// The frame canvas covers everything but the floor (FX0, FY0)-(FX1, FY1), which it leaves clear.
function renderFrame() {
  const c = mk(W, H), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), D = img.data;
  const n1 = nzc('oak1'), n2 = nzc('oak2'), n3 = nzc('oak3');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x >= FX0 && x < FX1 && y >= FY0 && y < FY1) continue;
    const k = (y * W + x) * 4; let col;
    if (x >= RIM && x < W - RIM && y >= RIM && y < H - FRONT) {
      // an inner wall face: t runs from the rim (0) down to the floor (1)
      const tl = (x - RIM) / WALLV, tr = (W - RIM - 1 - x) / WALLV, tt = (y - RIM) / WALLV, tb = (H - FRONT - 1 - y) / WALLV;
      const m = Math.min(tl, tr, tt, tb), side = m === tt ? 0 : m === tb ? 1 : m === tl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, m * 9 + side * 40, 300 + side * 71);
      const lit = side === 3 ? 1.0 : side === 1 ? 0.92 : side === 2 ? 0.46 : 0.4; // faces turned from the window go dark

      const m = Math.max(dt, db, dl, dr), side = m === dt ? 0 : m === db ? 1 : m === dl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, horiz ? y : x, side * 97.3);
      col = shade(col, 1 + Math.exp(-Math.pow((x * 0.55 + y * 0.83 - 300) / 560, 2)) * 0.09); // the rails' oiled sheen
      const ins = side === 0 ? RIM - y : side === 1 ? y - (H - FRONT) + 1 : side === 2 ? RIM - x : x - (W - RIM) + 1;
      if (ins <= 3) col = shade(mix(col, hex('#6f7a62'), 0.4), 0.8); // the glass edge, green in its thickness
      const mt = [Math.abs(dt - dl), Math.abs(dt - dr), Math.abs(db - dl), Math.abs(db - dr)];

}

// ---------- the card mount ----------

    let col, s = sD, ao = 0;

    } else if (tray && (x < TX0 || y < TY0 || x >= TX1 || y >= TY1)) {

    } else { // the floor: board with its fibres and formation

      col = mix(base[0], base[1], clamp(0.35 + g * 0.7));

      if (black) {

        col = shade(col, 1 + 0.07 * fbm(nm, x * 0.018, y * 0.018, 3) + 0.03 * fbm(nc, x * 0.004, y * 0.004, 2) + Math.min(0, rel) * 0.4);

// ---------- the window: falloff, glass lid, shadows ----------
// One window, upper left: the drawer falls off from bright to dark across its width. Multiplied over
// the whole composed frame, after the frame rails and before the glass.
function lightFalloff(ctx) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'multiply';
  const fall = ctx.createLinearGradient(40, 300, 1060, 700); fall.addColorStop(0, 'rgb(255,254,250)'); fall.addColorStop(0.45, 'rgb(228,219,206)'); fall.addColorStop(1, 'rgb(170,156,138)');
  ctx.fillStyle = fall; ctx.fillRect(0, 0, W, H);

// The lid: one soft reflection band, strongest high on the right, with dust and a few hairline
// scratches on the glass. The glass catches the window early in the build, the band sliding in from
// the right as it brightens; once the drawer is full the light only breathes. Drawn last.
// The band and its veil are baked once at full strength, blurred, into full-size layers; each frame

// order draws the same pixels.

    g.strokeStyle = '#24190f'; g.lineWidth = 0.17; g.beginPath(); g.moveTo(P[0][0], P[0][1]); g.lineTo(P[1][0], P[1][1]); g.stroke();
    const Q = catmull(P.slice(1), 8); g.lineWidth = 0.14; g.beginPath(); Q.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
    g.strokeStyle = 'rgba(150,120,90,0.45)'; g.lineWidth = 0.05; g.stroke();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  // reduce to the drawer's scale in two halvings
  const h2 = mk(size / 2, size / 2), g2 = h2.getContext('2d'); g2.imageSmoothingQuality = 'high'; g2.drawImage(S, 0, 0, size / 2, size / 2);
  const out = mk(size / 4, size / 4), g4 = out.getContext('2d'); g4.imageSmoothingQuality = 'high'; g4.drawImage(h2, 0, 0, size / 4, size / 4);
  return { c: out, ax: size / 8, ay: size / 8 };
}

// ---------- the trials ----------
// The same rule at the other two regular tilings, each cell the area of a worker cell (24.3 mm²),
// drawn by the routine that drew the comb's own lattice. Under each, the perimeter of a cell of unit
// area, sqrt(4 n tan(π/n)): the hexagon is the least, and it is the comb's.
const CELL_A = S3 / 2 * F * F;
const TRIAL_Y = 1088, TRIAL_R = 62, TS = 1.5; // the row is drawn at 1.5 times true size, every cell the same area
const TRIALS = [3, 4, 6].map((n, i) => ({ n, x: 176 + i * 178, y: TRIAL_Y, name: ['triangles', 'squares', 'hexagons'][i], P: perimUnit(n) }));
function tilingEdges(n, R) { // unique edges of the regular n-gon tiling, cells of area CELL_A within R of the origin, lattice-turned
  const E = new Map(), add = (a, b) => { const ka = a[0].toFixed(1) + ',' + a[1].toFixed(1), kb = b[0].toFixed(1) + ',' + b[1].toFixed(1), k = ka < kb ? ka + '|' + kb : kb + '|' + ka; if (!E.has(k)) E.set(k, [a, b]); };
  const poly = (cx, cy, pts) => { if (Math.hypot(cx, cy) > R) return; for (let k = 0; k < pts.length; k++) add(pts[k], pts[(k + 1) % pts.length]); };
  if (n === 6) for (let j = -9; j <= 9; j++) for (let i = -9; i <= 9; i++) { const [u, v] = ctrL(i, j); poly(u, v, [0, 1, 2, 3, 4, 5].map(c => [u + RC * CX[c], v + RC * CY[c]])); }
  if (n === 4) { const s = Math.sqrt(CELL_A); for (let j = -9; j <= 9; j++) for (let i = -9; i <= 9; i++) { const u = (i + 0.5) * s, v = (j + 0.5) * s; poly(u, v, [[u - s / 2, v - s / 2], [u + s / 2, v - s / 2], [u + s / 2, v + s / 2], [u - s / 2, v + s / 2]]); } }
  if (n === 3) { const s = Math.sqrt(4 * CELL_A / S3), h = s * S3 / 2; for (let j = -6; j <= 6; j++) for (let i = -12; i <= 12; i++) {
    const x0 = (i + (j & 1) * 0.5) * s, y0 = j * h, up = [[x0, y0 + h / 2], [x0 + s / 2, y0 - h / 2], [x0 + s, y0 + h / 2]], dn = [[x0 + s / 2, y0 - h / 2], [x0 + s * 1.5, y0 - h / 2], [x0 + s, y0 + h / 2]];
    poly(x0 + s / 2, y0 + h / 6, up); poly(x0 + s, y0 - h / 6, dn); } }
  return [...E.values()];
}
function bakeTrials() {
  TRIALS.forEach((q, ti) => {
    const ed = tilingEdges(q.n, TRIAL_R / TS), t0 = 3.3 + ti * 0.13;
    ed.sort((a, b) => (a[0][1] + a[1][1]) - (b[0][1] + b[1][1]));
    ed.forEach((e, k) => {
      const p = e.map(([u, v]) => [q.x + TS * (u * CR - v * SR), q.y + TS * (u * SR + v * CR)]), tt = t0 + 0.3 * k / ed.length;
      cStroke(p, tt, tt + 0.03, { seed: 'tr' + q.n + ':' + k, w: 1.5, tone: 1, tremor: 0.12 });
    });
  });
}

// ---------- the build ----------
// Cells rise first as round wax cups along a front from the comb's top, young wax so thin the pencil
// shows through; then each triple junction lets its wax flow, so the walls straighten one by one onto
// the drawn hexagons; then the cells are drawn out to their full depth and the comb takes its colour.
const AL0 = 0.84 * AL, ZT_CUP = 5 * MM, DA_CUP = 4.7 * MM, DA_FULL = Z_FULL - Z_APEX, KAP_FULL = CAP_DEPTH / RC;
const RT = new Float32Array(NC), DT = new Float32Array(NC), JT = new Float32Array(NC * 6);
for (let ci = 0; ci < NC; ci++) {
  const c = CELLS[ci], f = frontOf(c.u, c.v), r = rngFor('bt' + ci);
  RT[ci] = 1.35 + 0.6 * f + 0.05 * r(); DT[ci] = 2.6 + 0.75 * f + 0.06 * r();
  for (let k = 0; k < 6; k++) { const ju = c.u + RC * CX[k], jv = c.v + RC * CY[k]; JT[ci * 6 + k] = 1.85 + 0.75 * frontOf(ju, jv) + 0.14 * rngFor('jt' + JK(c.i, c.j, k))(); }
}
const COMB_DONE = Math.max(...DT) + 0.76;
let OPAC = 1; // how opaque the comb is as a whole: young wax lets the light through and casts little shadow
const DONE = new Uint8Array(NC), DONEN = new Uint8Array(NC); let FST = null; // which cells have reached their final state (and their neighbours too)
function setState(t) {
  let zmax = 0, on = 0, op = 0;
  for (let ci = 0; ci < NC; ci++) {
    const rp = Math.min(RMAX[ci], ease5((t - RT[ci]) / 0.38)), dp = Math.min(DMAX[ci], ease5((t - DT[ci]) / 0.75));
    ZT[ci] = lerp(rp * ZT_CUP, Z_FULL, dp); DA[ci] = lerp(rp * DA_CUP, DA_FULL, dp); KAP[ci] = rp * KAP_FULL;
    BA[ci] = lerp((SL[ci] < 1 ? 0.85 : 0.42) * rp, 1, dp); CA[ci] = smooth(0, 0.3, rp); WX[ci] = dp; CP[ci] = clamp((dp - 0.22) / 0.78);
    if (CA[ci] > 0 && SL[ci] >= 1) { on++; op += CA[ci] * lerp(0.25, 1, dp); }
    let lm = 0;
    for (let k = 0; k < 6; k++) { const l = Math.min(LMAX[ci], ease5((t - JT[ci * 6 + k]) / 0.45)); lm += l / 6; RHO[ci * 6 + k] = lerp(AL, RHO_F, l); }
    ALC[ci] = lerp(AL0, AL, lm) * SJ[ci];
    if (CA[ci] > 0) zmax = Math.max(zmax, ZT[ci]);
    if (FST) { const o = ci * 14, f = [ZT[ci], DA[ci], KAP[ci], BA[ci], CA[ci], WX[ci], CP[ci], ALC[ci], ...RHO.subarray(ci * 6, ci * 6 + 6)]; let d = 1; for (let q = 0; q < 14; q++) if (f[q] !== FST[o + q]) { d = 0; break; } DONE[ci] = d; }
  }
  if (FST) for (let ci = 0; ci < NC; ci++) { let d = DONE[ci]; const c = CELLS[ci]; for (let k = 0; k < 6 && d; k++) { const n = gridAt(c.i + NB[k][0], c.j + NB[k][1]); if (n >= 0 && !DONE[n]) d = 0; } DONEN[ci] = d; }
  OPAC = on ? op / on : 1;
  return zmax;
}
function keepFinal() { // after setState(DUR): remember every cell's final state
  FST = new Float32Array(NC * 14);
  for (let ci = 0; ci < NC; ci++) { const o = ci * 14; [ZT[ci], DA[ci], KAP[ci], BA[ci], CA[ci], WX[ci], CP[ci], ALC[ci], ...RHO.subarray(ci * 6, ci * 6 + 6)].forEach((v, q) => FST[o + q] = v); }
}

// ---------- the bees settle ----------
// Three workers, laid in by the curator once the comb has its colour: one set out on a pin over its
// label, 13 mm up the pin, wings spread to show their venation, and two lying on the comb with their wings folded, one
// with pollen in its baskets. Each comes down from above the drawer, nearer the camera so a little
// larger and out of focus, its shadow far and soft, closing in and sharpening as it lands.
const LIFT = 54 * MM, PIN_UP = 10 * MM, persp = z => CAM / (CAM - z);
const BEE_SPEC = [
  { key: 'a', pose: 'set', rot: 0, fx: 798, fy: 988, z: 13 * MM, floor: 0, t0: 3.42, spin: 0.14, pin: [0.55, 0.7], pr: 4.2 },
  { key: 'b', pose: 'rest', rot: 2.5, fx: 760, fy: 352, z: Z_FULL + 1.6 * MM, floor: Z_FULL, t0: 3.66, spin: -0.12, pollen: 1 },
  { key: 'c', pose: 'rest', rot: -0.7, fx: 640, fy: 660, z: Z_FULL + 1.6 * MM, floor: Z_FULL, t0: 3.88, spin: 0.1 },
];
function pinHead(x, y, r, a) { X.save(); X.globalAlpha = a; X.fillStyle = '#1c1714'; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); X.fillStyle = 'rgba(205,198,186,0.9)'; X.beginPath(); X.arc(x - r * 0.38, y - r * 0.4, r * 0.3, 0, 7); X.fill(); X.restore(); }
let BL = null; // a layer for the pinned bee, so the pin head's shadow falls on the bee alone
function drawBees(t) {
  for (const b of BEES) {
    const lin = (t - b.t0) / 0.55; if (lin <= 0) continue;
    const u = ease5(lin), z = b.z + (1 - u) * LIFT, k = persp(z) / persp(b.z), at = (zz, fx = b.fx, fy = b.fy) => { const q = persp(zz) / persp(b.z); return [VC[0] + (fx - VC[0]) * q, VC[1] + (fy - VC[1]) * q]; };
    const [x, y] = at(z), a = smooth(0, 0.12, lin), rot = (1 - u) * b.spin, dof = (z - b.z) / LIFT * 4.5, im = b.img, blur = dof > 0.05 ? `blur(${dof.toFixed(2)}px)` : 'none';
    // the shadow lies on whatever is under the bee, along the light
    X.save(); X.translate(b.fx, b.fy); X.rotate(rot); castShadow(X, im.c, -im.ax, -im.ay, z - b.floor, b.pin ? { alpha: 0.62 * a, blur: 1.5 + 4.5 * (z - b.floor) / b.z } : { alpha: 0.42 * a }); X.restore();
    if (!b.pin) {
      X.save(); X.globalAlpha = a; X.filter = blur; X.translate(x, y); X.rotate(rot); X.drawImage(im.c, -im.ax * k, -im.ay * k, im.c.width * k, im.c.height * k); X.restore();
      continue;
    }
    // the pin, through the right of the thorax: its foot in the card, its head PIN_UP above the bee
    const [px, py] = toScr(b.pin[0], b.pin[1], Math.cos(b.rot), Math.sin(b.rot)), fx = b.fx + px * MM, fy = b.fy + py * MM;
    const zf = z - b.z, zh = z + PIN_UP, pf = at(zf, fx, fy), pb = at(z, fx, fy), ph = at(zh, fx, fy), pr = b.pr * persp(zh) / persp(b.z);
    // its shadow on the card: sharp where the pin meets the card, softening up its length as the bee's does
    const sb = zz => 0.6 + 0.14 * zz * K * 0.45;
    X.save(); X.globalCompositeOperation = 'multiply'; X.globalAlpha = a; X.strokeStyle = 'rgba(60,42,28,0.85)'; X.lineWidth = 2.6; X.lineCap = 'butt';
    for (let i = 0; i < 8; i++) { const za = lerp(zf, zh, i / 8), zb = lerp(zf, zh, (i + 1) / 8); X.filter = `blur(${sb((za + zb) / 2).toFixed(2)}px)`; X.beginPath(); X.moveTo(fx + SH.x * za * K, fy + SH.y * za * K); X.lineTo(fx + SH.x * zb * K, fy + SH.y * zb * K); X.stroke(); }
    X.filter = `blur(${sb(zh).toFixed(1)}px)`; X.fillStyle = 'rgba(60,42,28,0.75)'; X.beginPath(); X.ellipse(fx + SH.x * zh * K, fy + SH.y * zh * K, pr * 1.2, pr * 1.6, Math.atan2(SH.y, SH.x) - Math.PI / 2, 0, 7); X.fill(); X.restore();
    // the bee, on its own layer, with the pin head's shadow laid across its back
    if (!BL) BL = mk(W, H); const bl = BL.getContext('2d'); bl.setTransform(1, 0, 0, 1, 0, 0); bl.globalCompositeOperation = 'source-over'; bl.filter = 'none'; bl.globalAlpha = 1; bl.clearRect(0, 0, W, H);
    bl.save(); bl.filter = blur; bl.translate(x, y); bl.rotate(rot); bl.drawImage(im.c, -im.ax * k, -im.ay * k, im.c.width * k, im.c.height * k); bl.restore();
    bl.globalCompositeOperation = 'source-atop'; bl.filter = 'blur(1.6px)'; bl.strokeStyle = 'rgba(36,24,14,0.5)'; bl.fillStyle = 'rgba(36,24,14,0.45)'; bl.lineWidth = 2.2;
    const hx = pb[0] + SH.x * PIN_UP * K, hy = pb[1] + SH.y * PIN_UP * K;
    bl.beginPath(); bl.moveTo(pb[0], pb[1]); bl.lineTo(hx, hy); bl.stroke(); bl.beginPath(); bl.arc(hx, hy, pr * 1.1, 0, 7); bl.fill();
    bl.globalCompositeOperation = 'source-over'; bl.filter = 'none';
    X.save(); X.globalAlpha = a; X.drawImage(BL, 0, 0); X.restore();
    // the pin above the bee, steel, and its black head
    X.save(); X.globalAlpha = a; X.filter = blur; X.strokeStyle = 'rgb(70,66,60)'; X.lineWidth = 1.6; X.beginPath(); X.moveTo(pb[0], pb[1]); X.lineTo(ph[0], ph[1]); X.stroke(); X.restore();
    pinHead(ph[0], ph[1], pr, a);
  }
}

// ---------- the page ----------
let CARD, FRAME, COMB_FINAL, COMB_FINAL_T, COMB_LIVE, COMB_LIVE_T, FIN = null, LIVE = null, BEES = [];
function label(t) {
  const lines = [{ text: 'No. 1', size: 12.5 }, { text: '*{Apis mellifera} Linnaeus, 1758', size: 15 }, { text: 'western honeybee, worker comb', size: 12.5 }, { text: 'equal cells, least wall: hexagons (Hales, 1999)', size: 12.5 }];
  const w = Math.round(Math.max(...lines.map(l => measureText(l.text, l.size))) + 30);
  labelCard(X, { x: TX1 - 26 - w, y: 1092, w, lines, prog: span(t, 3.85, 4.5), rot: -0.005, pad: 14, seed: 'bee-label' });
}
function trialText(t) {
  TRIALS.forEach((q, i) => {
    const t0 = 3.55 + i * 0.12;
    letterText(X, q.name, q.x, TRIAL_Y + TRIAL_R + 28, { size: 16, medium: 'pencil', align: 'center', prog: span(t, t0, t0 + 0.16), seed: 'tn' + i });
    const vw = letterText(X, q.P.toFixed(3), q.x, TRIAL_Y + TRIAL_R + 58, { size: 18, medium: 'pencil', align: 'center', prog: span(t, t0 + 0.1, t0 + 0.24), seed: 'tv' + i });
    if (q.n === 6) pencilTick(X, q.x + vw / 2 + 22, TRIAL_Y + TRIAL_R + 54, 24, { prog: span(t, 3.98, 4.12), seed: 'tick', w: 2.3 });
  });
}
async function seek(t) {
  t = clamp(t, 0, DUR);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(CARD, 0, 0);
  drawConstruction(t);
  drawNotes(t); trialText(t);
  let comb = null, tall = null, zt = Z_FULL; OPAC = 1;
  if (t >= COMB_DONE) { comb = COMB_FINAL; tall = COMB_FINAL_T; }
  else if (t > Math.min(...RT)) {
    zt = setState(t); renderComb(2, LIVE.img, LIVE.tall, FIN); // cells still changing at 2 x 2 samples; those done copied from the final
    COMB_LIVE.getContext('2d').putImageData(LIVE.img, 0, 0); COMB_LIVE_T.getContext('2d').putImageData(LIVE.tall, 0, 0); comb = COMB_LIVE; tall = COMB_LIVE_T;
  }
  if (comb) {
    sweptShadow(X, tall, CBX0, CBY0, zt, 0.3 * Math.pow(OPAC, 1.5)); // the long shadow, each part as tall as its cells, light: wax and honey pass some light
    castShadow(X, comb, CBX0, CBY0, 2.5 * MM, { alpha: 0.2 * OPAC, blur: 3 }); // the near shade under the comb's edge
    castShadow(X, comb, CBX0, CBY0, 0, { alpha: 0.42 * OPAC, blur: 2.2 }); // the card darkens all round where the comb sits on it
    castShadow(X, comb, CBX0, CBY0, 0.75 * MM, { alpha: 0.85 * OPAC, blur: 0.9 }); // and the tight core along its foot, away from the window
    X.drawImage(comb, CBX0, CBY0);
  }
  drawBees(t);
  label(t);
  X.drawImage(FRAME, 0, 0); lightFalloff(X); glass(X, t);
}
kitStart(async () => {
  CARD = renderCard({ tone: 'white' }); FRAME = renderFrame(); bakeTex();
  bakeConstruction(); bakeTrials(); bakeNotes();
  CONS_ID = CONS.getContext('2d').getImageData(0, 0, W, H);
  CB = [Math.max(0, CB[0]), Math.max(0, CB[1]), Math.min(W - 1, CB[2]), Math.min(H - 1, CB[3])];
  setState(DUR); keepFinal(); FIN = renderComb(3);
  COMB_FINAL = mk(CBW, CBH); COMB_FINAL.getContext('2d').putImageData(FIN.img, 0, 0); COMB_FINAL_T = mk(CBW, CBH); COMB_FINAL_T.getContext('2d').putImageData(FIN.tall, 0, 0);
  COMB_LIVE = mk(CBW, CBH); COMB_LIVE_T = mk(CBW, CBH); LIVE = { img: new ImageData(CBW, CBH), tall: new ImageData(CBW, CBH) };
  const tb = performance.now();
  BEES = BEE_SPEC.map(b => ({ ...b, img: renderBee(b) }));
  console.log('bees ms', performance.now() - tb);
}, seek);
</script>
