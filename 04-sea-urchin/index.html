<html><head><meta charset="utf-8"><title>Math-Animals 4: the test of the edible sea urchin</title>

</head><body><canvas id="c" width="1080" height="1350"></canvas>
<script>
"use strict";

// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing h px above the card throws its shadow h*K px along SH, and the
// higher it is the softer the shadow. MM is the drawer's true scale.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, MM = 3.6; // px per millimetre across the whole drawer
const SHC = 'rgb(44,30,20)'; // shadows multiply a warm brown into the card, so they stay warm and never go grey

// ---------- the drawer: oak rails, inner walls in depth, glass edge ----------
const RIM = 40, FRONT = 40, WALLV = 24, WALL_H = 22 * MM; // WALL_H: the drawer wall stands 22 mm above the card
const FX0 = RIM + WALLV, FY0 = RIM + WALLV, FX1 = W - RIM - WALLV, FY1 = H - FRONT - WALLV; // the floor
const OAK = { dark: hex('#3a2617'), mid: hex('#6b4628'), light: hex('#9a6c40') };
function _oakAt(n1, n2, n3, u, v, piece) {

  const stripe = 0.5 + 0.5 * Math.sin(wv * 1.9 + 3 * n2(wv * 0.08, u * 0.003 + piece));
  const col = mix(OAK.dark, OAK.mid, clamp(0.42 + fbm(n2, wv * 0.05 + piece, u * 0.006, 3) * 0.9 + stripe * 0.16));
  const fleck = smooth(0.38, 0.62, n3(u * 0.045 + piece, wv * 0.32)) * smooth(0.05, 0.35, n1(u * 0.012 + piece, wv * 0.05)); // ray fleck

// The frame canvas covers everything but the floor (FX0, FY0)-(FX1, FY1), which it leaves clear.
function renderFrame() {
  const c = mk(W, H), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), D = img.data;
  const n1 = nzc('oak1'), n2 = nzc('oak2'), n3 = nzc('oak3');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x >= FX0 && x < FX1 && y >= FY0 && y < FY1) continue;
    const k = (y * W + x) * 4; let col;
    if (x >= RIM && x < W - RIM && y >= RIM && y < H - FRONT) {
      // an inner wall face: t runs from the rim (0) down to the floor (1)
      const tl = (x - RIM) / WALLV, tr = (W - RIM - 1 - x) / WALLV, tt = (y - RIM) / WALLV, tb = (H - FRONT - 1 - y) / WALLV;
      const m = Math.min(tl, tr, tt, tb), side = m === tt ? 0 : m === tb ? 1 : m === tl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, m * 9 + side * 40, 300 + side * 71);

      const m = Math.max(dt, db, dl, dr), side = m === dt ? 0 : m === db ? 1 : m === dl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, horiz ? y : x, side * 97.3);
      col = shade(col, 1 + Math.exp(-Math.pow((x * 0.55 + y * 0.83 - 300) / 560, 2)) * 0.09); // the rails' oiled sheen
      const ins = side === 0 ? RIM - y : side === 1 ? y - (H - FRONT) + 1 : side === 2 ? RIM - x : x - (W - RIM) + 1;
      if (ins <= 3) col = shade(mix(col, hex('#6f7a62'), 0.4), 0.8); // the glass edge, green in its thickness

}

// ---------- the card mount ----------

      if (black) {

// ---------- the window: falloff, glass lid, shadows ----------
// One window, upper left: the drawer falls off from bright to dark across its width. Multiplied over
// the whole composed frame, after the frame rails and before the glass.
function lightFalloff(ctx) {

  const fall = ctx.createLinearGradient(40, 300, 1060, 700); fall.addColorStop(0, 'rgb(255,254,250)'); fall.addColorStop(0.45, 'rgb(228,219,206)'); fall.addColorStop(1, 'rgb(170,156,138)');
  ctx.fillStyle = fall; ctx.fillRect(0, 0, W, H);

// The lid: one soft reflection band, strongest high on the right, with dust and a few hairline
// scratches on the glass. The glass catches the window early in the build, the band sliding in from
// the right as it brightens; once the drawer is full the light only breathes. Drawn last.
// The band and its veil are baked once at full strength, blurred, into full-size layers; each frame

// order draws the same pixels.

  add(3.4, 3.7, (c, p) => letterText(c, 'five-fold is the rule; four- and six-fold tests are rare abnormalities', TRIAL_L, TRIAL_Y - TRIAL_R - 22, { size: 15, medium: 'pencil', prog: p, seed: 'abn', tone: tn(0.72) }));
  TRIAL_N.forEach((n, ti) => {
    STAGE = 'trial' + ti;
    const cx = TRIAL_X(ti), cy = TRIAL_Y, sc = TRIAL_R / T.R, t0 = 3.48 + ti * 0.12, G = areaGeom(n), rim = b => TRIAL_R * (1 - TRIAL_POLY * (1 - Math.cos(n * b * DEG)) / 2 * 1);
    const warp = (b, rpx) => rpx * (1 - TRIAL_POLY * (1 - Math.cos(n * b * DEG)) / 2 * Math.min(1, rpx / TRIAL_R) ** 2);
    add(t0, t0 + 0.22, (c, p) => { const pts = [], a = 23 + ti * 31; for (let b = a; b <= a + 361.5; b += 1.5) pts.push(at(b, rim(b), cx, cy)); pencil(c, pts, { prog: p, w: 1.15, tone: tn(0.82), overshoot: 2, seed: 'tc' + ti }); });
    add(t0 + 0.04, t0 + 0.16, (c, p) => pencilCircle(c, cx, cy, T.rG * sc, { prog: p, w: 1.0, tone: tn(0.72), seed: 'td' + ti }));
    add(t0 + 0.08, t0 + 0.18, (c, p) => pencilCircle(c, cx, cy, T.rPP * sc, { prog: p, w: 0.9, tone: tn(0.62), seed: 'tq' + ti }));
    // the pore pairs: two dots across the zone at each plate, from where the plates are tall enough to show
    const dots = [];
    for (let j = 0; j < n; j++) {
      const mid = G.th0 + j * G.sec + G.aI + G.aA / 2;
      for (const col of [0, 1]) for (let K = 0; K < COL_A.n; K++) {
        const sm = sOfK(K + 0.5 - col * 0.5, COL_A), r = rhoOfS(sm) * sc, hP = hOf(sm, COL_A) * sc; if (hP < 1.9 || r < T.rG * sc + 2.5) continue;
        const hw = r * G.aA / 2 * DEG, bz = mid + (col ? 1 : -1) * G.aA / 2 * 0.72, rr = warp(bz, r);
        for (const sg of [-1, 1]) {
          const q = at(bz + sg * Math.min(1.45, 0.14 * hw) / (rr * DEG), rr, cx, cy), ring = [];
          for (let a = 0; a <= 7; a++) ring.push([q[0] + 0.35 * Math.cos(a * 0.9), q[1] + 0.35 * Math.sin(a * 0.9)]);
          dots.push([ring, { w: 1.15, tone: 0.95, tremor: 0, taper: 0, overshoot: false, seed: `tp${ti}:${j}${col}:${K}${sg}` }, 0.15 + 0.8 * K / COL_A.n]);
        }
      }
      // and the interambulacrum's two meridional series of primary tubercles, one to each plate, as small open rings
      const midI = G.th0 + j * G.sec + G.aI / 2;
      for (const col of [0, 1]) for (let K = 0; K < COL_I.n; K++) {
        const k0 = K - col * 0.5, sm = sOfK(k0 + 0.5, COL_I), hPm = sOfK(k0 + 1, COL_I) - sOfK(k0, COL_I), r = rhoOfS(sm) * sc; if (hPm * sc < 3 || r < T.rG * sc + 3) continue;
        const bz = midI + (col ? 1 : -1) * G.aI / 4, rr = warp(bz, r), q = at(bz, rr, cx, cy), rt = Math.max(1.0, clamp(0.2 + 0.135 * hPm, 0.48, 1.42) * sc * 1.15), ring = [];
        for (let a = 0; a <= 12; a++) ring.push([q[0] + rt * Math.cos(a * 0.55), q[1] + rt * Math.sin(a * 0.55)]);
        dots.push([ring, { w: 0.9, tone: tn(0.6), tremor: 0, taper: 0, overshoot: false, seed: `tb${ti}:${j}${col}:${K}` }, 0.1 + 0.8 * K / COL_I.n]);
      }
    }
    add(t0 + 0.14, t0 + 0.4, (c, p) => pencilBatch(c, dots.filter(l => p * 1.0001 >= l[2]).map(l => [l[0], l[1]])));
    add(t0 + 0.3, t0 + 0.46, (c, p) => letterText(c, `n = ${n}`, cx, TRIAL_B1, { size: 15, medium: 'pencil', align: 'center', prog: p, seed: 'tn' + ti, tone: tn(0.86) }));
    add(t0 + 0.36, t0 + 0.5, (c, p) => letterText(c, `${+(360 / n).toFixed(1)}°`, cx, TRIAL_B2, { size: 14, tracking: 1.3, medium: 'pencil', align: 'center', prog: p, seed: 'ta' + ti, tone: tn(0.74) }));
    if (n === 5) add(4.08, 4.2, (c, p) => pencilTick(c, cx + 40, TRIAL_B1 - 6, 22, { prog: p, seed: 'tick', w: 1.9, tone: tn(1) }));
  });
}

// ---------- the build ----------
// 0.4-2.4 s the construction draws itself. 1.52 s the apical disc is set at the apex. 1.8-3.0 s sector
// 0 grows down its drawn meridians: plates come in under the disc and are pushed down until each
// lies on its drawn cell. 3.0-4.15 s four copies turn out from under it like the blades of a fan,
// through 72°, 144°, 216° and 288°, and the symmetry closes as the fifth meets the first. The trials
// and the label come last, by 4.5 s.
const T_DISC = [1.52, 1.86], T_GROW = [1.8, 3.0], T_FAN = [3.0, 4.15];
let CARD, FRAME, TEST_FIN; const STAGES = [];
const growE = p => ease5(p);
function frontRho(E) { const r = C => rhoOfS(sOfK(C.end * E, C)); return (r(COL_I) + r(COL_A)) / 2; }
function seek(t) {
  t = clamp(t, 0, DUR);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(CARD, 0, 0);
  for (const S of STAGES) {
    if (t >= S.t1) X.drawImage(S.cache, 0, 0);
    else for (const [a, b, f] of S.items) { const p = span(t, a, b); if (p > 0) f(X, p); }
  }
  const pd = span(t, T_DISC[0], T_DISC[1]), pg = span(t, T_GROW[0], T_GROW[1]), pf = span(t, T_FAN[0], T_FAN[1]);
  let img = null, alpha = 1;
  if (pf > 0) {
    const e = ease5(pf);
    testShadow(X, [[TH0 - 288 * e, TH0 + 72, T.R]], true);
    img = pf >= 1 ? TEST_FIN : composeTest({ fan: e });
  } else if (pd > 0) {
    const E = growE(pg), parts = [[0, 360, T.rMad]];
    if (E > 0) parts.push([TH0, TH0 + 72, frontRho(E)]);
    alpha = ease(pd);
    testShadow(X, parts, E >= 1, alpha);
    bake(LIVE, { I: COL_I.end * (1 - E), A: COL_A.end * (1 - E) });
    img = composeTest({ src: LIVE });
  }
  if (img) { X.globalAlpha = alpha; X.drawImage(img, BX0, BY0); X.globalAlpha = 1; }
  label(X, t);
  X.drawImage(FRAME, 0, 0);
  lightFalloff(X);
  glass(X, t);
}
async function init() {
  CARD = renderCard({ tone: 'white', seed: 'urchin-card' }); FRAME = renderFrame();
  buildConstruction(); buildTrials();
  for (const it of CONS) { let S = STAGES.find(q => q.name === it[3]); if (!S) STAGES.push(S = { name: it[3], items: [], t1: 0 }); S.items.push(it); S.t1 = Math.max(S.t1, it[1]); }
  for (const S of STAGES) { S.cache = mk(W, H); const cc = S.cache.getContext('2d'); for (const [, , f] of S.items) f(cc, 1); }
  DISCQ = new Uint8Array(NN); FIN = fieldSet(); bake(FIN, null);
  for (let j = 0; j < NH; j++) for (let i = 0; i < NW; i++) {
    const dx = BX0 + (i + 0.5) / SS - CX, dy = BY0 + (j + 0.5) / SS - CY, rho = Math.hypot(dx, dy) / MM; let th = Math.atan2(dx, -dy) / DEG; if (th < 0) th += 360;
    DISCQ[j * NW + i] = rho <= discEdge(th) ? 1 : 0;
  }
  LIVE = fieldSet(); markWedge(); bakeMacro();
  TEST_FIN = mk(BW, BH); TEST_FIN.getContext('2d').drawImage(composeTest({ src: FIN }), 0, 0);
}
kitStart(init, seek);
</script>
