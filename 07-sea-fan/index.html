</head><body><canvas id="c" width="1080" height="1350"></canvas>
<script>
"use strict";

// seen from straight above and lit by one window at the upper left. Its floor is a card mount; the

// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing h px above the card throws its shadow h*K px along SH, and the
// higher it is the softer the shadow. MM is the drawer's true scale.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, MM = 3.6; // px per millimetre across the whole drawer
const SHC = 'rgb(44,30,20)'; // shadows multiply a warm brown into the card, so they stay warm and never go grey

// ---------- the drawer: oak rails, inner walls in depth, glass edge ----------
const RIM = 40, FRONT = 40, WALLV = 24, WALL_H = 22 * MM; // WALL_H: the drawer wall stands 22 mm above the card
const FX0 = RIM + WALLV, FY0 = RIM + WALLV, FX1 = W - RIM - WALLV, FY1 = H - FRONT - WALLV; // the floor
const OAK = { dark: hex('#3a2617'), mid: hex('#6b4628'), light: hex('#9a6c40') };
function _oakAt(n1, n2, n3, u, v, piece) {
  const wv = v + 6 * fbm(n1, u * 0.004 + piece, piece, 3) + 1.5 * n2(u * 0.02, piece);
  const stripe = 0.5 + 0.5 * Math.sin(wv * 1.9 + 3 * n2(wv * 0.08, u * 0.003 + piece));
  const col = mix(OAK.dark, OAK.mid, clamp(0.42 + fbm(n2, wv * 0.05 + piece, u * 0.006, 3) * 0.9 + stripe * 0.16));
  const fleck = smooth(0.38, 0.62, n3(u * 0.045 + piece, wv * 0.32)) * smooth(0.05, 0.35, n1(u * 0.012 + piece, wv * 0.05)); // ray fleck

// The frame canvas covers everything but the floor (FX0, FY0)-(FX1, FY1), which it leaves clear.
function renderFrame() {
  const c = mk(W, H), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), D = img.data;
  const n1 = nzc('oak1'), n2 = nzc('oak2'), n3 = nzc('oak3');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x >= FX0 && x < FX1 && y >= FY0 && y < FY1) continue;
    const k = (y * W + x) * 4; let col;
    if (x >= RIM && x < W - RIM && y >= RIM && y < H - FRONT) {
      // an inner wall face: t runs from the rim (0) down to the floor (1)
      const tl = (x - RIM) / WALLV, tr = (W - RIM - 1 - x) / WALLV, tt = (y - RIM) / WALLV, tb = (H - FRONT - 1 - y) / WALLV;
      const m = Math.min(tl, tr, tt, tb), side = m === tt ? 0 : m === tb ? 1 : m === tl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, m * 9 + side * 40, 300 + side * 71);
      const lit = side === 3 ? 1.0 : side === 1 ? 0.92 : side === 2 ? 0.46 : 0.4; // faces turned from the window go dark

    } else {
      const dt = (RIM - y) / RIM, db = (y - (H - FRONT)) / FRONT, dl = (RIM - x) / RIM, dr = (x - (W - RIM)) / RIM;
      const m = Math.max(dt, db, dl, dr), side = m === dt ? 0 : m === db ? 1 : m === dl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, horiz ? y : x, side * 97.3);
      col = shade(col, 1 + Math.exp(-Math.pow((x * 0.55 + y * 0.83 - 300) / 560, 2)) * 0.09); // the rails' oiled sheen
      const ins = side === 0 ? RIM - y : side === 1 ? y - (H - FRONT) + 1 : side === 2 ? RIM - x : x - (W - RIM) + 1;
      if (ins <= 3) col = shade(mix(col, hex('#6f7a62'), 0.4), 0.8); // the glass edge, green in its thickness
      const mt = [Math.abs(dt - dl), Math.abs(dt - dr), Math.abs(db - dl), Math.abs(db - dr)];
      if (Math.min(...mt) * Math.min(RIM, FRONT) < 0.7 && m > 0) col = shade(col, 0.55); // mitred corners
    }

  }

}

// ---------- the card mount ----------

// The board's surface tooth at a pixel: 1 on a fibre's crown, 0 down in a pit.
function cardTooth(x, y) { _bakeTooth(_TSEED || 'card'); const i = x | 0, j = y | 0; return i < 0 || j < 0 || i >= W || j >= H ? 0.5 : _TOOTH[j * W + i]; }

// ---------- the unit tray ----------

// the tray wall's cut card top, and its inner faces seen in depth (the camera is above the drawer's

const TX0 = Math.ceil(_TRAY.i[0] + _TRAY.f[0]), TY0 = Math.ceil(_TRAY.i[1] + _TRAY.f[1]), TX1 = Math.floor(_TRAY.i[2] - _TRAY.f[2]), TY1 = Math.floor(_TRAY.i[3] - _TRAY.f[3]);

  const n1 = nzc(seed + ':g1'), n2 = nzc(seed + ':g2'), nc = nzc(seed + ':cockle'), nm = nzc(seed + ':mottle'), ns = nzc('slot');

  for (let y = FY0; y < FY1; y++) for (let x = FX0; x < FX1; x++) {
    const k = y * W + x, sD = Math.max(band(y - FY0, LD * SH.y), band(x - FX0, LD * SH.x));
    let col, s = sD, ao = 0;
    const e = Math.min(x - TO[0], TO[2] - 1 - x, y - TO[1], TO[3] - 1 - y);

    } else if (tray && (x < TX0 || y < TY0 || x >= TX1 || y >= TY1)) {

      const tl = (x - TI[0]) / TF[0], tt = (y - TI[1]) / TF[1], tr = (TI[2] - 1 - x) / TF[2], tb = (TI[3] - 1 - y) / TF[3];
      const m = Math.min(tl, tt, tr, tb), t = clamp(m);

    } else { // the floor: board with its fibres and formation

      col = mix(base[0], base[1], clamp(0.35 + g * 0.7));

      // pulp lies a little cloudy. Cockle: the board lifts a hair between its fixings.
      const emb = (T[k + W + 1] - T[k - W - 1]) * 0.035 + (F[k + W + 1] - F[k - W - 1]) * 0.03 + (T[k] - 0.5) * 0.028;
      if (black) {

        // crowns and the fibres' backs as a warm grey sheen, and the pits sink. Formation is broader.
        const rel = (T[k + W + 1] - T[k - W - 1]) * 0.3 + (F[k + W + 1] - F[k - W - 1]) * 0.14 + (T[k] - 0.5) * 0.36;
        col = shade(col, 1 + 0.07 * fbm(nm, x * 0.018, y * 0.018, 3) + 0.03 * fbm(nc, x * 0.004, y * 0.004, 2) + Math.min(0, rel) * 0.4);

// ---------- the window: falloff, glass lid, shadows ----------
// One window, upper left: the drawer falls off from bright to dark across its width. Multiplied over
// the whole composed frame, after the frame rails and before the glass.
function lightFalloff(ctx) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'multiply';
  const fall = ctx.createLinearGradient(40, 300, 1060, 700); fall.addColorStop(0, 'rgb(255,254,250)'); fall.addColorStop(0.45, 'rgb(228,219,206)'); fall.addColorStop(1, 'rgb(170,156,138)');
  ctx.fillStyle = fall; ctx.fillRect(0, 0, W, H);

// The lid: one soft reflection band, strongest high on the right, with dust and a few hairline
// scratches on the glass. The glass catches the window early in the build, the band sliding in from
// the right as it brightens; once the drawer is full the light only breathes. Drawn last.
// The band and its veil are baked once at full strength, blurred, into full-size layers; each frame
// only slides them by whole pixels and scales their alpha, so no filter runs per frame and any seek
// order draws the same pixels.

function _glassLayers() {

  // stripe laid over the work. Over black board nothing else is bright, so there the band is wider still.

    for (const [o, c] of stops) g.addColorStop(o, c);

    cc.translate(948 + 160, RIM - 10); cc.rotate(0.17); cc.filter = `blur(${blur}px)`; cc.drawImage(s, -SW / 2 - (black ? 40 : 0), -200);

    letterText(ctx, 'fusions', fx0, fy0, { size: 16, medium: 'pencil', prog: span(t, t0 + 0.55, t0 + 0.7), seed: 'w:fus', tone: 1.15 });
    RINGS.forEach((r, i) => { // from under the word, fanning out to each ring's edge
      const ex = fx0 + fw * (0.25 + 0.25 * i), ey = fy0 + 8, a = Math.atan2(ey - r.y, ex - r.x);
      pencil(ctx, [[ex, ey], [r.x + Math.cos(a) * (RING_R + 1), r.y + Math.sin(a) * (RING_R + 1)]], { seed: 'lf' + i, w: 1.5, tone: 1.15, prog: span(t, t0 + 0.45 + i * 0.06, t0 + 0.6 + i * 0.06), overshoot: false });
    });
  }
  letterText(ctx, 'free space:', ax0, ay0, { size: 16, medium: 'pencil', prog: span(t, t0 + 0.35, t0 + 0.5), seed: 'w:free', tone: 1.15 });
  letterText(ctx, 'attractors', ax0, ay0 + 23, { size: 15, medium: 'pencil', prog: span(t, t0 + 0.42, t0 + 0.56), seed: 'w:att', tone: 1.15 });
  pencil(ctx, [[ax0 + measureText('attractors', 15) + 8, ay0 + 18], [fx(-62), fy(138)]], { seed: 'lfree', w: 1.5, tone: 1.15, prog: span(t, t0 + 0.4, t0 + 0.55), overshoot: false });
}
function drawNotes(ctx, t) {
  const S = STATS, x = LABEL_X(), y = TRIAL.y + 30, t0 = TL.notes[0], L = [
    `a model, ${fmt(S.n)} attractors`,
    `a = ${RULE.a} mm, openings ${S.wopen.toFixed(1)} mm`];
  L.forEach((s, i) => letterText(ctx, s, x + 2, y + i * 24, { size: 15, medium: 'pencil', prog: span(t, t0 + 0.2 + i * 0.1, t0 + 0.42 + i * 0.1), seed: 'note' + i, tone: 1.15 }));
}
// the label at the right of the foot, level with the trials, its notes under it
const LABEL_LINES = () => [{ text: 'No. 7' }, { text: '*{Gorgonia ventalina} Linnaeus, 1758' }, { text: 'common sea fan' }, { text: LABEL_RULE }];
const LABEL_WD = () => Math.round(Math.max(...LABEL_LINES().map(l => measureText(l.text, 13, { face: 'type' }))) + 34);
const LABEL_X = () => TX1 - 25 - LABEL_WD();
function drawLabel(ctx, t) {
  const w = LABEL_WD(), side = WIN.s * MM;
  labelCard(ctx, { x: LABEL_X(), y: TRIAL.y - side + 26, w, lines: LABEL_LINES(), prog: span(t, TL.label[0], TL.label[1]), rot: -0.005, pad: 14, seed: 'label7' });
}
const LABEL_RULE = 'tips grow to free space and fuse';

// ---------- the build ----------
// The glass catches the window; the fan's field is outlined and stippled with its attractors, from the
// foot up; the holdfast spreads, the stem climbs, and the branches climb through the dots, consuming
// each as they reach it, fusing where they meet, until the colony is collected at step 156. The
// trials are sketched and the label lettered last.
const TL = { env: [0.38, 1.0], dots: [0.62, 1.5], hold: [1.42, 1.85], grow: [1.55, 4.05], trials: [3.45, 4.43], notes: [3.62, 4.45], label: [3.85, 4.5] };
const span = (t, a, b) => clamp((t - a) / (b - a));
function kAt(t) { const u = span(t, TL.grow[0], TL.grow[1]); return FAN.stop * (u - Math.sin(2 * Math.PI * u) / (2 * Math.PI)); }
let CARD, FRAME, ENV, DOTS, DOTT, G0;
function drawDots(ctx, t, k) {
  const A = G0.A;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let s = 0; s < A.length; s++) {
    let a = span(t, DOTT[s], DOTT[s] + 0.07); if (a <= 0) continue;
    if (!G0.alive[s]) a *= 1 - 0.72 * smooth(G0.killed[s] - 1.2, G0.killed[s] + 0.3, k); // consumed: rubbed out, a ghost of graphite left
    if (a <= 0.01) continue;
    const x = Math.round(fx(A[s][0])) - 4, y = Math.round(fy(A[s][1])) - 4;
    ctx.globalAlpha = a; ctx.drawImage(DOTS, x, y, 8, 8, x, y, 8, 8);
  }
  ctx.restore();
}
function construction(t, k) {
  pencil(X, ENV, { seed: 'env', w: 1.6, tone: 1.15, prog: ease(span(t, TL.env[0], TL.env[1])), overshoot: false });
  pencilCross(X, fx(HOLD.x), fy(HOLD.y), 14, { prog: span(t, 0.95, 1.15), seed: 'holdx', tone: 1.15, w: 1.6 });
  drawDots(X, t, k);
}
// The colony is rastered and shaded afresh every frame of the build, so the workers do it in row
// bands (each holds the net, sent once at load); the page composes their bands, then its shadows.
let FAN_MW = false;
const MW_JOBS = {
  setNet(S) { NET = S.NET; HB = S.HB; ZAX = S.ZAX; U0 = S.U0; PH = S.PH; TRUNK = S.TRUNK; GV = S.GV; return {}; },
  fan(band, k, holdE) { rasterColony(k, stemR(radiiAt(NET, k)), holdE, band); return { D: shadeColony(band) }; },
};
async function colonyAt(t) {
  const k = kAt(t), holdE = ease(span(t, TL.hold[0], TL.hold[1]));
  if (k <= 0 && holdE <= 0) return null;
  const R = stemR(radiiAt(NET, k)), parts = FAN_MW ? await MW.bandsPer(3, 'fan', k, holdE) : null;
  if (parts) { MW.merge(FANI.data, parts, 'D', FB.h); FANX.putImageData(FANI, 0, 0); }
  else { rasterColony(k, R, holdE); shadeColony(); }
  shadowsColony(k, R, holdE);
  return k;
}
// After the build every mark is finished and only the glass breathes: the frame under the glass is
// composed once and kept.
const T_STATIC = 4.62; let STATIC = null;
// A seek waits for the workers before it draws, so each frame is drawn in one go; seeks run in turn.
let SEEKS = Promise.resolve();
function seek(t) { const p = SEEKS.then(() => seekNow(t)); SEEKS = p.catch(() => {}); return p; }
async function seekNow(t) {
  t = clamp(t, 0, DUR);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  if (t >= T_STATIC && STATIC) { X.drawImage(STATIC, 0, 0); glass(X, t); return; }
  const col = await colonyAt(t);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(CARD, 0, 0);
  const k = kAt(t);
  construction(t, k);
  drawWindow(X, t); drawTrials(X, t); drawNotes(X, t); drawAnnotations(X, t);
  if (col !== null) { drawShadows(X); X.drawImage(FANC, FB.x0, FB.y0); }
  drawQuadrat(X, t); drawLabel(X, t);
  X.drawImage(FRAME, 0, 0);
  lightFalloff(X);
  if (t >= T_STATIC) { STATIC = mk(W, H); STATIC.getContext('2d').drawImage(cv, 0, 0); }
  glass(X, t);
}
async function init() {
  CARD = renderCard({ tone: 'white', seed: 'card7' }); FRAME = renderFrame();
  const env = fanEnvelope('env');
  G0 = growFan({ ...ruleAt(RULE.a), env, root: FAN.root, seed: 'fan', iters: FAN.stop });
  NET = buildNet(G0, FAN.cx, FAN.by); planeField(NET, radiiAt(NET, FAN.stop)); bakeHoldfast(); prepNet(NET);
  ENV = env.concat([env[0]]).map(p => [fx(p[0]), fy(p[1])]);
  growTrials(); measureColony(); leadStarts();
  // the attractors, pencilled once; each is stippled in as the hand works up the field
  DOTS = mk(W, H); const dg = DOTS.getContext('2d');
  const ys = G0.A.map(p => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys), jr = rngFor('dots:order');
  DOTT = new Float32Array(G0.A.length);
  pencilMany(dg, G0.A.map((p, s) => { DOTT[s] = TL.dots[0] + (TL.dots[1] - TL.dots[0] - 0.1) * (p[1] - y0) / (y1 - y0) + (jr() - 0.5) * 0.08; return [dotPts(fx(p[0]), fy(p[1]), 0.62), { seed: 'a' + s, tone: 1.15, w: 2.2, tremor: 0, taper: 0 }]; }));
  FAN_MW = !!(await MW.each('setNet', { NET: { ...NET, g: null }, HB, ZAX, U0, PH, TRUNK, GV }));
}
kitStart(init, seek);
</script>
