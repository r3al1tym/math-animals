// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing h px above the card throws its shadow h*K px along SH, and the
// higher it is the softer the shadow. MM is the drawer's true scale.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, MM = 3.6; // px per millimetre across the whole drawer
const SHC = 'rgb(44,30,20)'; // shadows multiply a warm brown into the card, so they stay warm and never go grey

// ---------- the drawer: oak rails, inner walls in depth, glass edge ----------
const RIM = 40, FRONT = 40, WALLV = 24, WALL_H = 22 * MM; // WALL_H: the drawer wall stands 22 mm above the card
const FX0 = RIM + WALLV, FY0 = RIM + WALLV, FX1 = W - RIM - WALLV, FY1 = H - FRONT - WALLV; // the floor
const OAK = { dark: hex('#3a2617'), mid: hex('#6b4628'), light: hex('#9a6c40') };

function renderFrame() {
  const c = mk(W, H), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), D = img.data;
  const n1 = nzc('oak1'), n2 = nzc('oak2'), n3 = nzc('oak3');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

// ---------- the window: falloff, glass lid, shadows ----------

// The lid: one soft reflection band, strongest high on the right, with dust and a few hairline

// All of it is pencil on the card, under the specimen. The meeting point in the loupe is led to the
// same point of the shell (the leader runs on under the shell to it). The two largest tents in
// view are ringed on the fan and carried by arcs about the tip (a cone rolls about its tip) to the
// same tents on the shell. The fan's cell arcs 100 to 400 run on past its first radius, under the
// shell and out beyond it, as rings round the cone.
let KO = null;
function onShellAt(age, cell) { // the pixel of the shell's outer face that shows (age, cell)
  const S = SHELL; let bd = 1e9, at = null;
  for (let k = 0; k < S.w * S.h; k++) {
    if (S.cov[k] < 1 || S.zone[k] !== 0) continue;
    const d = Math.pow(S.ageT[k] - age, 2) + Math.pow(S.cell[k] - cell, 2);
    if (d < bd) { bd = d; at = [S.x0 + k % S.w + 0.5, S.y0 + Math.floor(k / S.w) + 0.5]; }
  }
  return at;
}
// the two largest white tents on the shell's face, other than the loupe's
let PAIRS = [];
function findPairs() {
  if (LOUPE.none) { PAIRS = []; return; }
  const A0 = 200, A1 = 440, C0 = 40, C1 = 470, Wd = C1 - C0 + 1, Hd = A1 - A0 + 1, lab = new Int32Array(Wd * Hd).fill(-1), comps = [];
  const white = (age, c) => fieldAt(age, c) < 0.2 && (fieldP(age, c, true), FP < 0.25);
  const L = LOUPE, la = L.apex[0] + L.K / 2, lc = L.apex[1];
  for (let j = 0; j < Hd; j++) for (let i = 0; i < Wd; i++) {
    const k = j * Wd + i; if (lab[k] >= 0 || !white(A0 + j, C0 + i)) continue;
    const id = comps.length; let n = 0, sa = 0, sc = 0, hitL = false; const st = [k]; lab[k] = id;
    while (st.length) {
      const q = st.pop(), qj = (q / Wd) | 0, qi = q % Wd; n++; sa += qj; sc += qi;
      if (Math.abs(A0 + qj - la) < 4 && Math.abs(C0 + qi - lc) < 4) hitL = true;
      for (const [dj, di] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nj = qj + dj, ni = qi + di; if (nj < 0 || nj >= Hd || ni < 0 || ni >= Wd) continue; const nk = nj * Wd + ni; if (lab[nk] >= 0 || !white(A0 + nj, C0 + ni)) continue; lab[nk] = id; st.push(nk); }
    }
    const age = A0 + sa / n, cell = C0 + sc / n, fanArea = n * (rhoAtCell(cell) * PHI / R_TURN) * (SLANT / (N_LIP - N_RAMP));
    if (!hitL) comps.push({ age, cell, n, fanArea });
  }
  comps.sort((p, q) => q.fanArea - p.fanArea);
  PAIRS = comps.slice(0, 2).map((p, i) => ({ ...p, fan: fanPt(fanPhi(p.age), rhoAtCell(p.cell)), shell: onShellAt(p.age, p.cell), r: clamp(0.3 * Math.sqrt(p.fanArea), 10, 18), seed: 'pair' + i }));
}
// The registration as drawn when the lip has reached age gc: [{pts | circle, w, dash, prog}]
function regPaths(gc) {
  const L = LOUPE, out = [];
  if (L.onShell && L.apL && gc <= L.apex[0] + 0.5) {
    const pa = clamp((L.apex[0] + 0.5 - gc) / 8), [ax, ay] = L.apL, [px, py] = L.onShell, dx = px - ax, dy = py - ay, d = Math.hypot(dx, dy);
    const q0 = [ax + dx / d * 11, ay + dy / d * 11];
    if (pa > 0) out.push({ pts: [q0, [lerp(q0[0], px, pa), lerp(q0[1], py, pa)]], w: 1.5, seed: 'shlead' });
  }
  for (const p of PAIRS) { // ringed on the fan as the lip writes them, then rolled onto the shell
    const pa = clamp((p.age - 10 - gc) / 14); if (pa <= 0) continue;
    out.push({ circle: [p.fan[0], p.fan[1], p.r], prog: pa, w: 1.5, seed: p.seed + 'r' });
    if (!p.shell) continue;
    const r = Math.hypot(p.fan[0] - C[0], p.fan[1] - C[1]), a0 = Math.atan2(p.fan[1] - C[1], p.fan[0] - C[0]), a1 = Math.atan2(p.shell[1] - C[1], p.shell[0] - C[0]);
    let da = a1 - a0; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    const s0 = a0 + Math.sign(da) * (p.r + 4) / r, e1 = a0 + da, pr = clamp(pa * 1.3 - 0.3), pts = [];
    for (let k = 0; k <= 40; k++) { const a = lerp(s0, lerp(s0, e1, pr), k / 40); pts.push([C[0] + r * Math.cos(a), C[1] + r * Math.sin(a)]); }
    if (pr > 0) out.push({ pts, w: 1.4, dash: [7, 4], seed: p.seed + 'a' });
  }
  return out;
}
// A draughtsman leaves a gap in the hatching for a leader: under each leader the card is restored
// in a narrow channel before the leader is drawn.
function knockout(gc) {
  const ps = regPaths(gc); if (!ps.length) return;
  if (!KO) KO = mk(W, H);
  const g = KO.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#000';
  for (const q of ps) { g.lineWidth = q.w + 6; g.beginPath(); if (q.circle) g.arc(q.circle[0], q.circle[1], q.circle[2], 0, TAU); else { g.moveTo(q.pts[0][0], q.pts[0][1]); for (const p of q.pts) g.lineTo(p[0], p[1]); } g.stroke(); }
  g.globalCompositeOperation = 'source-in'; g.drawImage(CARD, 0, 0); g.globalCompositeOperation = 'source-over';
  X.drawImage(KO, 0, 0);
}
function registration(t, gc) {
  for (const q of regPaths(gc)) {
    const o = { w: q.w, dash: q.dash, prog: q.prog ?? 1, seed: q.seed };
    if (q.circle) pencilCircle(X, q.circle[0], q.circle[1], q.circle[2], o); else pencil(X, q.pts, o);
  }
}

// ---------- the build ----------
// 0.45-1.7 s the construction is drawn. 1.05-1.6 s the spire grows from its apex, nine whorls.
// 1.6-3.95 s the lip sweeps the last whorl: on the fan the pencil writes each growth line in turn,
// and on the shell the body whorl is laid line by line, the triangles closing where waves meet.
// The hand slows over the half of the whorl the shell shows.
const T_SP = [1.05, 1.6], T_SW = [1.6, 3.95];
// The lip's pace in growth lines per second, as a function of the line it is writing: it eases in
// and out, slows over the half of the whorl the shell shows, and slows again to draw the loupe.
let SWEEP = null;
function bakeSweep() {
  const pace = age => (0.06 + 0.94 * smooth(R_TURN, R_TURN - 50, age) * smooth(0, 50, age))
    * (1 - 0.45 * Math.exp(-Math.pow((age - 0.5 * R_TURN) / 170, 2)))
    * (1 - 0.7 * Math.exp(-Math.pow((age - LOUPE.age) / (LOUPE.K * 0.9), 2)));
  const n = R_TURN, c = new Float64Array(n + 1);
  for (let k = 1; k <= n; k++) c[k] = c[k - 1] + 1 / pace(R_TURN - k + 0.5);
  for (let k = 0; k <= n; k++) c[k] /= c[n];
  SWEEP = c;
}
function sweepAge(q) { // q in 0..1 of the sweep's time -> the age the lip has reached
  const c = SWEEP; let lo = 0, hi = c.length - 1; q = clamp(q);
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] < q) lo = m; else hi = m; }
  const f = (q - c[lo]) / Math.max(1e-9, c[hi] - c[lo]);
  return R_TURN - (lo + f);
}
function frontAge(t) { // the age the lip has reached: everything older is laid
  if (t < T_SP[0]) return 1e9;
  if (t < T_SP[1]) return lerp(AGE_MAX, R_TURN, ease5(span(t, T_SP[0], T_SP[1])) * 0.85 + span(t, T_SP[0], T_SP[1]) * 0.15);
  if (t < T_SW[1]) return sweepAge(span(t, T_SW[0], T_SW[1]));
  return -4;
}

// ---------- the construction ----------
const scr = ph => U_ANG - ph; // a fan angle as a canvas angle
const fanPt = (ph, r) => { const d = fanDir(ph); return [C[0] + d[0] * r, C[1] + d[1] * r]; };
const GL_STEP = 80, CELL_STEP = 100; // growth lines drawn every 80, cells every 100
function construction(t) {
  const P = { overshoot: 5 }, OUT = { w: 1.8, overshoot: 5 };
  // the contact radius: the lip, the line the shell lies along, run on past the apex
  const apexR = ZAP * COSA + 4 * MM;
  pencil(X, [[C[0] - U[0] * 14, C[1] - U[1] * 14], [C[0] + U[0] * apexR, C[1] + U[1] * apexR]], { ...P, tone: 0.9, prog: span(t, 0.45, 0.8), seed: 'lipline' });
  pencilCross(X, C[0], C[1], 10, { prog: span(t, 0.42, 0.55), seed: 'tipx' });
  // the fan's outline, heavier than the rest: both outer radii are growth line 320, and the arc
  for (const [ph, sd] of [[PH0, 'farR'], [PH1, 'farL']]) pencil(X, [[C[0], C[1]], fanPt(ph, SLANT + 6)], { ...OUT, prog: span(t, 0.55, 0.85), seed: sd });
  pencilArc(X, C[0], C[1], SLANT, scr(PH1), scr(PH0), { ...OUT, prog: span(t, 0.6, 1.05), seed: 'arc' });
  // growth lines every 80; the two nearest the lip run on under the shell and out past its spire
  for (let n = GL_STEP; n < R_TURN; n += GL_STEP) {
    if (n === R_TURN / 2) continue;
    const k = n / GL_STEP, ph = fanPhi(R_TURN - n), a = fanPt(ph, FAN_IN[0] * 1.1), b = fanPt(ph, SLANT);
    pencil(X, [a, b], { w: 1.15, tone: 0.74, overshoot: 3, prog: span(t, 0.82 + k * 0.045, 1.05 + k * 0.045), seed: 'gl' + n });
  }
  for (const n of [40, 600]) {
    const ph = fanPhi(R_TURN - n);
    pencil(X, [fanPt(ph, FAN_IN[0] * 1.1), fanPt(ph, SLANT + 95)], { w: 1.15, tone: 0.8, overshoot: 3, prog: span(t, 1.1, 1.4), seed: 'glu' + n });
  }
  // cells every 100, as arcs across the whole whorl: under the shell they join up, rings round the cone
  for (let c = CELL_STEP, k = 0; c < N_LIP; c += CELL_STEP, k++) {
    const r = rhoAtCell(c); if (r < FAN_IN[0]) continue;
    pencilArc(X, C[0], C[1], r, scr(PH1), scr(PH0), { w: 1.2, tone: 0.8, prog: span(t, 0.95 + k * 0.06, 1.3 + k * 0.06), seed: 'cell' + c });
  }
  // numbers: growth lines along the arc (320 at both outer radii), cells down the left radius
  for (const [n, ph] of [[320, PH0], [160, fanPhi(480)], [480, fanPhi(160)], [320, PH1]]) {
    const p = fanPt(ph, SLANT + 20), k = n / 320;
    letterText(X, String(n), p[0], p[1] + 5, { size: 15, medium: 'pencil', align: 'center', prog: span(t, 1.15 + k * 0.05, 1.3 + k * 0.05), seed: 'gn' + n + ':' + ph.toFixed(2) });
  }
  for (let c = CELL_STEP; c < N_LIP; c += 2 * CELL_STEP) {
    const r = rhoAtCell(c), p = fanPt(PH1 + 15 / r, r), k = c / CELL_STEP;
    letterText(X, String(c), p[0], p[1] + 5, { size: 15, medium: 'pencil', align: 'right', prog: span(t, 1.25 + k * 0.05, 1.4 + k * 0.05), seed: 'cn' + c });
  }
}
// The one closing triangle the loupe enlarges, pressed harder on the fan once the lip has closed it.
function fanTriangle(t, gc) {
  const L = LOUPE; if (!L.fronts.length || gc > L.apex[0] + 0.5) return;
  const pr = clamp((L.apex[0] + 0.5 - gc) / 10);
  for (const side of [1, 2]) {
    const pts = [fanPt(fanPhi(L.apex[0]), rhoAtCell(L.apex[1]))].concat(L.fronts.map(q => fanPt(fanPhi(q[0]), rhoAtCell(q[side]))));
    pencil(X, pts, { w: 1.9, prog: pr, tremor: 0.15, seed: 'ftri' + side });
  }
}

// ---------- the trials: the same program at other values of s_b ----------
// Each runs the model on a 160-cell lip with everything else as on the shell, and is sketched on
// the same small dorsal outline: growth runs to the left, the lip runs down the shell. The pencil
// traces the crests and lays a light tone where the deposit is, so the white tents read. Each
// trial shows half a whorl of its own run, ending at growth line END (counted from the start of
// the run); for s_b = 0.10 that half whorl is one where triangles of several sizes are in view.
const TRIAL = { N: 160, ramp: 6, vals: [0.05, 0.1, 0.22, 0.3, 0.6], words: ['zigzags', 'triangles', 'beads', 'stripes', 'blank'], end: [1360, 1270, 768, 768, 768] };
TRIAL.RT = Math.round(TRIAL.N * R_TURN / N_LIP);
const TR_H = 185, TR_S = TR_H / SHL, TR_Y = 1148, TR_X0 = 168, TR_DX = 186;
const TRIALS = [];
function bakeTrials() {
  TRIAL.vals.forEach((sb, i) => {
    const real = sb === MODEL.sb;
    let fA, fG, N = TRIAL.N, RT = TRIAL.RT, ramp = TRIAL.ramp;
    if (real) { // the ticked trial is the specimen itself: its own field, every cell, drawn small
      N = N_LIP; RT = R_TURN; ramp = N_RAMP;
      fA = (age, cell) => fieldAt(age, cell); fG = (age, cell) => (fieldP(age, cell, true), FP);
    } else {
      const END = TRIAL.end[i], F = new Float32Array((RT + 2) * N), G = new Float32Array((RT + 2) * N), P = new Float32Array(N);
      simulate({ ...MODEL, sb }, N, END + 1, 'trial:' + sb, (r, a) => {
        for (let c = 0; c < N; c++) P[c] = Math.max(a[c], P[c] * PD);
        const age = END - r; if (age >= 0 && age <= RT + 1) { F.set(a, age * N); G.set(P, age * N); }
      });
      const at = (A, age, cell) => { const j = clamp(Math.floor(age), 0, RT), fj = clamp(age - j), q = clamp(cell, 0, N - 1.001), c0 = Math.floor(q), fc = q - c0, k = j * N + c0; return (A[k] * (1 - fc) + A[k + 1] * fc) * (1 - fj) + (A[k + N] * (1 - fc) + A[k + N + 1] * fc) * fj; };
      fA = (age, cell) => at(F, age, cell); fG = (age, cell) => at(G, age, cell);
    }
    const cx = TR_X0 + i * TR_DX, x0 = Math.floor(cx - RS * TR_S * 1.12) - 3, y0 = Math.floor(TR_Y - ZAP * TR_S) - 3;
    const w = Math.ceil(2 * RS * TR_S * 1.12) + 6, h = Math.ceil(ZAP * TR_S) + 6;
    const pat = graphiteField(x0, y0, w, h, (x, y) => {
      let s = 0;
      for (let sy = -1; sy <= 1; sy++) for (let sx = -1; sx <= 1; sx++) {
        const xx = x + sx / 3, yy = y + sy / 3, z = (TR_Y - yy) / TR_S; if (z < 2 * MM || z > ZS) continue;
        const R = radiusAt(z, Math.PI) * TR_S, u = (xx - cx) / R; if (Math.abs(u) >= 0.985) continue;
        const th = Math.PI + Math.asin(u), age = th / TAU * RT, cell = ramp + (N - ramp) * (1 - z / ZS);
        s += Math.max(smooth(0.12, 0.5, fA(age, cell)), 0.3 * smooth(0.03, 0.5, fG(age, cell)));
      }
      return s / 9;
    });
    const L = [], R = [];
    for (let z = 0; z <= ZAP; z += 0.5) { L.push([cx - radiusAt(z, Math.PI / 2) * TR_S, TR_Y - z * TR_S]); R.push([cx + radiusAt(z, 1.5 * Math.PI) * TR_S, TR_Y - z * TR_S]); }
    const sut = [];
    for (let k = 0; k < KSP - 1; k++) sut.push([[cx - rSut(k + 0.25) * TR_S, TR_Y - zSut(k + 0.25) * TR_S], [cx + rSut(k + 0.75) * TR_S, TR_Y - zSut(k + 0.75) * TR_S]]);
    TRIALS.push({ sb, word: TRIAL.words[i], cx, x0, y0, pat, outline: L.concat(R.reverse()), sut, real });
  });
}
function trials(t) {
  TRIALS.forEach((q, i) => {
    const t0 = 3.15 + i * 0.13, p = span(t, t0, t0 + 0.42);
    if (p <= 0) return;
    pencil(X, q.outline, { w: 1.45, prog: p, seed: 'tro' + i, tremor: 0.2 });
    pencil(X, q.sut[0], { w: 1.1, tone: 0.8, prog: span(t, t0 + 0.25, t0 + 0.35), seed: 'trs' + i });
    // the pattern is sketched in growth order: oldest at the right, the lip at the left
    const pp = span(t, t0 + 0.1, t0 + 0.55);
    if (pp > 0) { const cw = q.pat.width * ease(pp); X.drawImage(q.pat, q.pat.width - cw, 0, cw, q.pat.height, q.x0 + q.pat.width - cw, q.y0, cw, q.pat.height); }
    const vy = TR_Y + 31;
    letterText(X, 's_{b} = ' + q.sb.toFixed(2), q.cx, vy, { size: 17, medium: 'pencil', align: 'center', prog: span(t, t0 + 0.3, t0 + 0.5), seed: 'trv' + i });
    letterText(X, q.word, q.cx, vy + 26, { size: 16, medium: 'pencil', align: 'center', prog: span(t, t0 + 0.38, t0 + 0.56), seed: 'trw' + i });
    if (q.sb === SB_TEXTILE) pencilTick(X, q.cx, vy + 58, 22, { w: 1.9, prog: span(t, 4.0, 4.16), seed: 'tick' });
  });
}

// One short line for the fan; the magnifier's note carries the rule (the equations are in NOTES.md).
const FANCAP = 'the body whorl unrolled: radii are growth lines';
function notes(t) {
  letterText(X, FANCAP, TX0 + 26, 139, { size: 15, medium: 'pencil', prog: span(t, 1.45, 1.9), seed: 'fcap' });
}
const LABEL = [
  { text: 'No. 8', size: 12.5 },
  { text: '*{Conus textile} Linnaeus, 1758', size: 15 },
  { text: 'cloth-of-gold cone, 130 mm', size: 12.5 },
  { text: 'each growth line is one step', size: 12.5 },
  { text: 'of the waves along the lip', size: 12.5 },
];
// grown at another s_b, the label says so
if (MODEL.sb !== SB_TEXTILE) LABEL.push({ text: 'grown here at s_{b} = ' + String(+MODEL.sb.toFixed(3)) + ', not 0.10', size: 12.5 });
function label(t) {
  const w = Math.round(Math.max(...LABEL.map(l => measureText(l.text, l.size, l))) + 30);
  labelCard(X, { x: TX1 - 28 - w, y: 158, w, lines: LABEL, prog: span(t, 3.85, 4.5), rot: -0.005, pad: 14, seed: 'label-09' });
}

function seek(t) {
  t = clamp(t, 0, DUR);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(CARD, 0, 0);
  construction(t); notes(t);
  const gc = frontAge(t);
  if (gc < R_TURN) { // the fan, written up to the lip
    X.save(); X.beginPath();
    for (const [a, b] of writtenSpans(gc)) { X.moveTo(C[0], C[1]); for (let k = 0; k <= 32; k++) { const q = fanPt(lerp(a - 0.01, b + 0.01, k / 32), SLANT + 3); X.lineTo(q[0], q[1]); } X.closePath(); }
    X.clip(); X.drawImage(FANPAT, FANBOX[0], FANBOX[1]); X.restore();
  }
  fanTriangle(t, gc);
  loupe(t, gc);
  knockout(gc); registration(t, gc); // pencil, under the specimen
  if (gc < 1e8) { composeShell(gc); drawShadow(X, 1); X.drawImage(SHELL_C, SHELL.x0, SHELL.y0); }
  trials(t);
  label(t);
  X.drawImage(FRAME, 0, 0);
  lightFalloff(X);
  glass(X, t);
}
// ---------- the site's control: the same lip at any s_b ----------
// The site's slider calls draw(v): the model on a 260-cell lip with s_b = v and every other value
// as on the shell, one seed at every v so only s_b changes, coloured by the shell's own pigment
// rule. Growth runs down the strip, the newest line at the bottom. value is the s_b the plate grew at.
window.__vary = {
  name: 's_b', key: 'sb', min: 0.03, max: 0.6, step: 0.005, scale: 'log', value: MODEL.sb, digits: 3,
  textile: SB_TEXTILE, marks: TRIAL.vals.map((v, i) => [v, TRIAL.words[i], v === SB_TEXTILE]),
  note: 'the lip at s<sub>b</sub> = {v}: each row is one growth line, the newest at the bottom',
  draw(v) {
    const N = 260, KEEP = 130, ROWS = 900, img = new Uint8ClampedArray(N * KEEP * 4), P = new Float32Array(N);
    simulate({ ...MODEL, sb: v }, N, ROWS, 'vary', (r, a) => {
      for (let c = 0; c < N; c++) P[c] = Math.max(a[c], P[c] * PD);
      const j = r - (ROWS - KEEP); if (j < 0) return;
      for (let c = 0; c < N; c++) { const q = pigment(a[c], P[c], c * N_LIP / N), k = (j * N + c) * 4; img[k] = q[0]; img[k + 1] = q[1]; img[k + 2] = q[2]; img[k + 3] = 255; }
    });
    return { w: N, h: KEEP, data: img };
  },
};
kitStart(async () => {
  const t0 = performance.now(), shellJob = MW.bands('shell', MODEL.sb);
  CARD = renderCard({ tone: 'white' }); FRAME = renderFrame();
  runMain(); const t1 = performance.now();
  await bakeShellBands(shellJob); const t2 = performance.now();
  SHELL_C = mk(SHELL.w, SHELL.h); SHELL_I = SHELL_C.getContext('2d').createImageData(SHELL.w, SHELL.h);
  bakeBands(); const t3 = performance.now();
  bakeFan(); const t4 = performance.now();
  bakeTrials(); const t5 = performance.now();
  findLoupe(); bakeLoupe(); bakeSweep(); findPairs();
  window.__times = { card: 0, sim: t1 - t0, shell: t2 - t1, bands: t3 - t2, fan: t4 - t3, trials: t5 - t4 };
}, seek);
</script>
