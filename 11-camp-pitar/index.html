<script>
"use strict";
// Math-Animals No. 11. One valve of a camp pitar, Lioconcha castrensis, on wet basalt sand at low tide.
// The shell is grown the way the clam grows it: by accretion at the margin. The outline is a polar
// table about the beak, every growth line is an iso-line of r = d / R(phi), age follows a von

const W = 1080, H = 1350, DUR = 6, HERO = 5.2, BUILD_END = 4.6;
const cv = document.getElementById('c'), X = cv.getContext('2d');

const _nz = {}; const nzc = k => _nz[k] || (_nz[k] = noiseFor(k));
function fbm(n, x, y, oct = 4) { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2.03; } return s / t; }

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const hexL = h => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---------- palette: a decision, three colours ----------
// CREAM is the aragonite of the shell, UMBER the pigment of the tents, BASALT the wet grey sand of
// volcanic and quartz grains, a cool mid grey so the only warm colours on the page are the animal's. Every other
// tone is one of these three under the light: chalk is cream worn matte, chestnut is umber laid thin.
const PAL = { cream: hexL('#ece2cf'), umber: hexL('#4d2d10'), basalt: hexL('#7a766e') };
// umber laid thin over cream reads warmer, as a glaze does: chestnut is that, not a mix toward grey
// melanin's absorption per unit density, set so that a full density over cream gives umber
const ABS = [0, 1, 2].map(k => -Math.log(PAL.umber[k] / PAL.cream[k]));
const CHESTNUT = [PAL.umber[0] * 2.9, PAL.umber[1] * 2.6, PAL.umber[2] * 1.6], CHALK = mix3(PAL.cream, [1, 1, 1], 0.35);

// ---------- light: one low sun, upper left ----------
// The sun stands 13 degrees up, from the upper left. Shadows run down and to the right, 4.3 px
// for every px of height. The sky is the only other light: a soft, cool fill from above.
const SUN_EL = 13 * Math.PI / 180, SUN_DIR = [-0.8, -0.6]; // horizontal direction toward the sun
const SUNV = [SUN_DIR[0] * Math.cos(SUN_EL), SUN_DIR[1] * Math.cos(SUN_EL), Math.sin(SUN_EL)];
const TAN_EL = Math.tan(SUN_EL);
const SUN_RGB = [1.55, 1.34, 1.06], SKY_RGB = [0.22, 0.27, 0.36];
const HV0 = (() => { const v = [SUNV[0], SUNV[1], SUNV[2] + 1], m = Math.hypot(...v); return v.map(c => c / m); })(); // halfway between sun and eye

// ---------- the valve: an outline, read as a polar table about the beak ----------
// Local units are valve lengths, the beak at the origin, y down; this is a right valve seen from
// outside, so the anterior end, and the way the beak turns, is to the right. The outline is an open
// Catmull-Rom curve that leaves the beak and returns to it, so the beak keeps its point.
const VAL = { L: 830, bx: 330, by: 262, rot: -0.62 };
const OUTLINE = [[0, 0], [-0.1, 0.02], [-0.24, 0.07], [-0.38, 0.15], [-0.5, 0.26], [-0.58, 0.39], [-0.61, 0.52], [-0.58, 0.64], [-0.5, 0.75], [-0.36, 0.83], [-0.19, 0.865], [0, 0.86], [0.15, 0.82], [0.27, 0.73], [0.35, 0.61], [0.385, 0.48], [0.37, 0.35], [0.32, 0.23], [0.24, 0.13], [0.15, 0.06], [0.07, 0.02], [0, 0]];
function openSpline(p, seg) {

  for (let i = 0; i < n - 1; i++) {
    const p0 = q(i - 1), p1 = q(i), p2 = q(i + 1), p3 = q(i + 2);
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t, f = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);

}
// R[i] is the distance from the beak to the margin along angle i: 1440 entries round the circle,
// zero outside the fan. r = d / R is then the fraction of the way from beak to margin, and since the
// clam grows by adding to its margin in proportion, r is also the growth line a point lies on.
const NB = 1440, POLY = openSpline(OUTLINE, 24), R = new Float32Array(NB), SIG = new Float32Array(NB);
for (let i = 0; i < NB; i++) {
  const a = -Math.PI + (i + 0.5) / NB * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
  let best = 0;
  for (let k = 0; k < POLY.length - 1; k++) {
    const p = POLY[k], q = POLY[k + 1], ex = q[0] - p[0], ey = q[1] - p[1], den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-12) continue;
    const t = (p[0] * ey - p[1] * ex) / den, u = (p[0] * dy - p[1] * dx) / den;
    if (t > 1e-6 && u >= 0 && u <= 1 && t > best) best = t;
  }

}
// sigma: arc length along the margin, 0 at the posterior end of the hinge and 1 at the anterior end.
// It is the mantle edge's own coordinate, the "space" axis of the reaction.
{
  let s = 0; const dA = Math.PI * 2 / NB;
  for (let i = NB - 1; i >= 0; i--) { const dR = (R[Math.min(NB - 1, i + 1)] - R[Math.max(0, i - 1)]) / (2 * dA); if (R[i] > 0) s += Math.hypot(R[i], dR) * dA; SIG[i] = s; }
  for (let i = 0; i < NB; i++) SIG[i] /= s;
  VAL.margin = s; // the margin's length in valve lengths
}
function polarAt(lx, ly) { // local point -> distance d, table radius Rr, fraction r, margin coordinate sig
  const d = Math.hypot(lx, ly), f = (Math.atan2(ly, lx) + Math.PI) / (Math.PI * 2) * NB - 0.5;
  const i = Math.floor(f), u = f - i, i0 = (i + NB) % NB, i1 = (i + 1) % NB;
  const Rr = R[i0] * (1 - u) + R[i1] * u, sig = SIG[i0] * (1 - u) + SIG[i1] * u;
  return { d, Rr, r: Rr > 0 ? d / Rr : 99, sig };
}
const VC = Math.cos(VAL.rot), VS = Math.sin(VAL.rot);
const toLocal = (x, y) => { const dx = x - VAL.bx, dy = y - VAL.by; return [(dx * VC + dy * VS) / VAL.L, (-dx * VS + dy * VC) / VAL.L]; };
const toScreen = (lx, ly) => [VAL.bx + (lx * VC - ly * VS) * VAL.L, VAL.by + (lx * VS + ly * VC) * VAL.L];

// ---------- growth: von Bertalanffy, with two checks ----------
// Age tau runs 0..TT. The margin's fraction r grows fast in youth and slows with age, so the
// growth lines crowd toward the margin. Twice the clam stops growing for a while (a cold spell,
// a spawning) and the reaction runs on with nothing to write on, so the record jumps across each check.
const GROW = { TT: 330, r0: 0.022, slow: 2.5, checks: [[102, 13], [220, 11]] }; // [effective age, pause]
GROW.E = GROW.TT - GROW.checks.reduce((s, c) => s + c[1], 0);
GROW.k = Math.log(GROW.slow) / GROW.E;
function effAge(tau) { let e = tau; for (const [at, p] of GROW.checks) { if (e > at) e = Math.max(at, e - p); } return e; }

// ---------- the margin model: Meinhardt's activator-inhibitor, run along the mantle edge ----------
//   da/dt = s (a^2 / (b (1 + sa a^2)) + ba) - ra a + Da d2a/dx2
//   db/dt = kb s a^2 - rb b + rb b0
// The inhibitor lives long and does not spread, so activation travels: a cell that fires sets off
// two waves running apart (the peak of a tent), waves that meet annihilate (its foot), and the
// inhibitor left behind keeps the tissue refractory for a while (the white inside). New cells are
// inserted as the margin lengthens, so the pattern keeps its scale while the shell grows. Each
// recorded row is one growth increment: the shell is the reaction's space-time diagram.
// A cell fires at random (pt), but only once its inhibitor has fallen below brec, so new waves
// start in rested tissue and the fronts stay clean. Each firing also releases a short pulse of a
// fast-spreading signal (lifetime tD, reach tv cells per unit time, the wave's own speed): see the
// tents below. The inhibitor's recovery rate drifts slowly by sector (rv: up to e^rv faster or
// slower, rf sectors round the margin, drifting over rt), so rows of tents fall out of step.
// bk lowers the dome at the beak (see the dome).
const RD = { rv: 1.5, rf: 4, rt: 120, seed: 2, kg: 14, pw: 0.14, bk: 0.25, tv: 2.0, tc: 1.0, tD: 50, brec: 0.85, NF: 2470, M: 2560, T_ROW: 0.4, dt: 0.025, Da: 1.0, ra: 1, sa: 0.25, ba: 0.02, b0: 0.3, kb: 0.015, rb: 0.035, kick: 2, pt: 0.0008 };

// wave sets laying keeps laying for a set time w (longer, by up to fill, where the cells are more
// ready), so each arm is a line of even width behind its front, darkest at the front
const PIGM = { a: 1.2, w: 4, fill: 3 };
// a tuning hook for scratch/var.py: ?p=key:value,... sets RD (or PIGM, with a P prefix)
{ const q = new URLSearchParams(location.search).get('p'); if (q) for (const kv of q.split(',')) { const [k, v] = kv.split(':'); if (k[0] === 'P') PIGM[k.slice(1)] = +v; else RD[k] = +v; } }

function blurRecord(A, sx = 1.3, sy = 1.7) { // separable gaussian, sx cells along the margin, sy rows across

  for (let r = 0; r < NR; r++) { const o = r * M; for (let j = 0; j < M; j++) { let q = 0; for (let k = -rx; k <= rx; k++) q += A[o + clamp(j + k, 0, M - 1)] * kx[k + rx]; tmp[j] = q; } A.set(tmp.subarray(0, M), o); }
  for (let j = 0; j < M; j++) { for (let r = 0; r < NR; r++) { let q = 0; for (let k = -ry; k <= ry; k++) q += A[clamp(r + k, 0, NR - 1) * M + j] * ky[k + ry]; tmp[r] = q; } for (let r = 0; r < NR; r++) A[r * M + j] = tmp[r]; }
}
function runMargin() {

  // fire more readily than others, and their tents run smaller and closer
  const sAt = (sig) => 1 + 0.035 * zn(sig * 5.0, 0.5);
  // the posterior end of the mantle, under the escutcheon, fires far more often: there the waves
  // are small and close, a dense field of fine zigzag lines, and no tents
  const post = sig => 1 - smooth(0.25 * RD.pw, RD.pw, sig);
  const ptAt = (sig, tau, juv) => RD.pt * (0.2 + 2.0 * smooth(-0.3, 0.4, zn(sig * 3.1 + 7, 2.5 + tau / 140))) * (1 + 14 * post(sig) * (1 - juv));

  for (let i = 0; i < n; i++) { const g = i / (n - 1); a.push(RD.ba); b.push(RD.b0 * (0.6 + 0.8 * rnd())); s.push(sAt(g)); sg.push(g); lx.push(-1e9); }
  const na = new Float64Array(RD.NF + 8), lin = new Float64Array(RD.NF + 8), pti = new Float64Array(RD.NF + 8), rbc = new Float64Array(RD.NF + 8), zr = nzc('recover'), tfl = new Float64Array(RD.NF + 8);

    while (n < target) { // a mantle cell divides; its daughter sits between two neighbours
      const k = 1 + Math.floor(rnd() * (n - 1)), g = (sg[k - 1] + sg[k]) / 2;
      a.splice(k, 0, (a[k - 1] + a[k]) / 2); b.splice(k, 0, (b[k - 1] + b[k]) / 2); s.splice(k, 0, (s[k - 1] + s[k]) / 2); sg.splice(k, 0, g); lx.splice(k, 0, Math.max(lx[k - 1], lx[k])); n++;
    }

    // cells lay only while the inhibitor is near its peak, and its tents are small, so the umbo
    // carries fine zigzag lines and the bold tents come with size
    const juv = 1 - smooth(0.1, 0.34, r);
    for (let i = 0; i < n; i++) pti[i] = ptAt(sg[i], tau, juv) * RD.dt;
    // the inhibitor's recovery runs at its own slowly drifting rate in each sector of the mantle,
    // so sectors keep their own time: their rows of tents drift apart, and where a fast sector
    // meets a slow one a row branches or two rows merge
    for (let i = 0; i < n; i++) rbc[i] = RD.rb * Math.exp(RD.rv * zr(sg[i] * RD.rf + 4.3, tau / RD.rt + 2.1));

    // is high they lay longer, so the lines there thicken into chestnut fields; the young clam's

    for (let i = 0; i < n; i++) {

    // lasts, the pigment cells that its own wave has passed keep laying, so the peak of each Λ fills
    // solid down to a base laid all at once when the pulse dies, and the arms run on as lines. A
    // cell that a neighbouring wave reached first is not its own wave's, and is left alone.

        const age = tau - e[1]; if (age > e[2]) continue; ev[keep++] = e;
        // The pulse is weaker toward its reach, so the base of the tent arcs up to its corners. Its
        // reach on each side is the wave's own run: while that arm still runs it is the pulse's full
        // reach, and once the arm has met another wave or stalled in an older wake it is where the
        // arm stopped, so the base comes down to meet the arm there and no tent ends in a wall.
        const half = RD.tv * e[2] / n, own = i => lx[i] >= e[1] + Math.abs(sg[i] - e[0]) * n / RD.tv - 2;

        const runs = j => (a[j] > 0.3 || (j + 1 < n && a[j + 1] > 0.3) || (j > 0 && a[j - 1] > 0.3));

  // record is averaged over a group (about 2.5 cells by 3 rows) and laid where the group agrees,
  // which drops specks and fills pinholes. Then the pigment spreads a little in the shell layer as
  // it is laid, about a cell along the margin and a growth increment or two across, so the edge is
  // soft and no cell's step survives.
  blurRecord(PIG, 2.5, 3); for (let k = 0; k < PIG.length; k++) PIG[k] = smooth(0.42, 0.58, PIG[k]);

}

// ---------- reading the record back: radius -> row ----------
// The first row whose margin had reached r. During a growth check the margin stands still, so
// those rows are never written on the shell, and the pattern after a check starts afresh.
let RTAB = null;
