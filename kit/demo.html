<script>

// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing h px above the card throws its shadow h*K px along SH, and the
// higher it is the softer the shadow. MM is the drawer's true scale.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, MM = 3.6; // px per millimetre across the whole drawer
const SHC = 'rgb(44,30,20)'; // shadows multiply a warm brown into the card, so they stay warm and never go grey

// ---------- the drawer: oak rails, inner walls in depth, glass edge ----------
const RIM = 40, FRONT = 40, WALLV = 24, WALL_H = 22 * MM; // WALL_H: the drawer wall stands 22 mm above the card
const FX0 = RIM + WALLV, FY0 = RIM + WALLV, FX1 = W - RIM - WALLV, FY1 = H - FRONT - WALLV; // the floor
const OAK = { dark: hex('#3a2617'), mid: hex('#6b4628'), light: hex('#9a6c40') };
function _oakAt(n1, n2, n3, u, v, piece) {

  const stripe = 0.5 + 0.5 * Math.sin(wv * 1.9 + 3 * n2(wv * 0.08, u * 0.003 + piece));
  const col = mix(OAK.dark, OAK.mid, clamp(0.42 + fbm(n2, wv * 0.05 + piece, u * 0.006, 3) * 0.9 + stripe * 0.16));
  const fleck = smooth(0.38, 0.62, n3(u * 0.045 + piece, wv * 0.32)) * smooth(0.05, 0.35, n1(u * 0.012 + piece, wv * 0.05)); // ray fleck

// The frame canvas covers everything but the floor (FX0, FY0)-(FX1, FY1), which it leaves clear.
function renderFrame() {
  const c = mk(W, H), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), D = img.data;
  const n1 = nzc('oak1'), n2 = nzc('oak2'), n3 = nzc('oak3');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x >= FX0 && x < FX1 && y >= FY0 && y < FY1) continue;
    const k = (y * W + x) * 4; let col;
    if (x >= RIM && x < W - RIM && y >= RIM && y < H - FRONT) {
      // an inner wall face: t runs from the rim (0) down to the floor (1)
      const tl = (x - RIM) / WALLV, tr = (W - RIM - 1 - x) / WALLV, tt = (y - RIM) / WALLV, tb = (H - FRONT - 1 - y) / WALLV;
      const m = Math.min(tl, tr, tt, tb), side = m === tt ? 0 : m === tb ? 1 : m === tl ? 2 : 3, horiz = side < 2;
      col = _oakAt(n1, n2, n3, horiz ? x : y, m * 9 + side * 40, 300 + side * 71);

      col = _oakAt(n1, n2, n3, horiz ? x : y, horiz ? y : x, side * 97.3);
      col = shade(col, 1 + Math.exp(-Math.pow((x * 0.55 + y * 0.83 - 300) / 560, 2)) * 0.09); // the rails' oiled sheen
      const ins = side === 0 ? RIM - y : side === 1 ? y - (H - FRONT) + 1 : side === 2 ? RIM - x : x - (W - RIM) + 1;
      if (ins <= 3) col = shade(mix(col, hex('#6f7a62'), 0.4), 0.8); // the glass edge, green in its thickness

}

// ---------- the card mount ----------

// ---------- the window: falloff, glass lid, shadows ----------

// The lid: one soft reflection band, strongest high on the right, with dust and a few hairline

// the right as it brightens; once the drawer is full the light only breathes. Drawn last.

// ---------- the label ----------
// A slip of buff label stock cut from a sheet with a knife along a rule: crisp edges a hair off

  const bow = [0, 1, 2, 3].map(() => (r() - 0.5) * 0.9), lit = [1, 0, 0, 1]; // each edge bowed a little; top and left face the window
  const E = C.map((A, e) => { const B = C[(e + 1) % 4], ex = B[0] - A[0], ey = B[1] - A[1], l = Math.hypot(ex, ey); return { A, ex, ey, ll: l * l, nx: ey / l, ny: -ex / l }; });

    if (d > -1.4) col = shade(col, lit[ed] ? 1.06 : 0.84); // the cut edge: a bright lip toward the window, a dull one away

}
// labelCard(ctx, opts): x, y (top-left), w (auto), lines [{text, size (15 if italic, else 12.5),
// italic, align}], prog (0..1 across all lines, line by line), rot (radians), pad (12), lead (1.7),
// lift (px, height of its faint ambient shade), seed, face ('type', the default: typed in one size,
// typeSize 13, binomials underlined; or 'hand', lettered in ink). Returns its bbox {x, y, w, h} before rotation.
function labelCard(ctx, o = {}) {
  const pad = o.pad ?? 12, lead = o.lead ?? 1.7, seed = o.seed || 'label';
  const L = (o.lines || []).map(l => ({ ...l, size: l.size || (l.italic || l.text.includes('*{') ? 15 : 12.5) })); // the binomial line a size up
  let wMax = 0, yb = pad;
  L.forEach((l, i) => { l.w = measureText(l.text, l.size, l); wMax = Math.max(wMax, l.w); yb += i ? l.size * lead : l.size * 1.05; l.y = yb; });
  const w = Math.round(o.w ?? wMax + 2 * pad + 6), h = Math.round(yb + (L.length ? L[L.length - 1].size * 0.42 : 0) + pad);

  castShadow(ctx, stock, -_SP, -_SP, 0.5 * MM, { alpha: 0.5, blur: 0 }); // the contact line where the slip lies on the board: a crisp hairline below and right

    const n = L.map(l => _marks(l.text).length), ts = Math.min(o.typeSize ?? 13, (w - 2 * pad) / (Math.max(1, ...n) * TYPE_PITCH));

// ---------- the page contract ----------
// kitStart(init, seek): window.__riso for the render tools; ?t=2.5 shows that moment, ?play plays the
// build in real time from 0 and holds at the hero. seek may be async; frames drop if it is slow.
function kitStart(init, seek) {
  const R = window.__riso = { duration: DUR, ready: false, seek, hero: HERO, build: { end: BUILD_END } }, q = new URLSearchParams(location.search);
  (async () => {
    await init();
    if (q.has('play')) {
      await seek(0); R.ready = true; const t0 = performance.now();
      for (;;) { await new Promise(requestAnimationFrame); const t = Math.min(HERO, (performance.now() - t0) / 1000); await seek(t); if (t >= HERO) break; }
    } else { const t = Number(q.get('t')); await seek(q.has('t') && isFinite(t) ? t : HERO); R.ready = true; }
  })();
}
// ===== math-animals kit v1 end =====

// The kit demo: an empty drawer with one construction, the chambered nautilus's equiangular spiral
// r = a·e^(bθ) with its radii every 30°, three trial spirals along the foot and the label. No animal.
// ?card=black draws it in white pencil on the black card; ?sheet=1 shows the hand's whole set.
const cv = document.getElementById('c'), X = cv.getContext('2d'), Q = new URLSearchParams(location.search);
const BLACK = Q.get('card') === 'black', SHEET = Q.has('sheet');
let CARD, FRAME;

// ---------- the spiral ----------
// r = a·e^(bθ), θ counter-clockwise on screen from +x. The last turn ends pointing right at radius R.
const B_REAL = 0.1778, TURN = 2 * Math.PI;
function spiral(b, R, rMin = 2.5, th1 = 8 * TURN) {

  const at = th => { const r = rAt(th); return [r * Math.cos(th), -r * Math.sin(th)]; };
  const pts = []; for (let th = th0; th < th1; th += Math.min(0.08, 1.2 / rAt(th))) pts.push(at(th)); pts.push(at(th1));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }

const shift = (pts, x, y) => pts.map(p => [p[0] + x, p[1] + y]);
const MAIN = spiral(B_REAL, 420);
const PX = 540 - (MAIN.box[0] + MAIN.box[2]) / 2, PY = 486 - (MAIN.box[1] + MAIN.box[3]) / 2; // the pole
const TRIALS = [0.10, B_REAL, 0.30].map((b, i) => { const s = spiral(b, 62, 2); return { s, b, x: 168 + i * 172 - (s.box[0] + s.box[2]) / 2, y: 1110 - (s.box[1] + s.box[3]) / 2, cx: 168 + i * 172 }; });
const span = (t, a, b) => clamp((t - a) / (b - a));

function construction(t) {
  const P = { seed: 'main', w: 1.6 };
  pencil(X, shift(MAIN.pts, PX, PY), { ...P, prog: smooth(0.4, 1.3, t) });
  pencilCross(X, PX, PY, 9, { prog: span(t, 0.4, 0.55), seed: 'pole', tone: 0.75 });
  // the radii every 30°, each from the pole out to the last turn, its crossings with the inner turns
  // marked; each is numbered with its true length in mm
  for (let k = 0; k < 12; k++) {
    const al = k * TURN / 12, th = MAIN.th1 - ((MAIN.th1 - al) % TURN + TURN) % TURN, r = MAIN.rAt(th);
    const ux = Math.cos(al), uy = -Math.sin(al), p = span(t, 0.8 + k * 0.055, 1.08 + k * 0.055);
    pencilLine(X, PX, PY, PX + ux * r, PY + uy * r, { prog: p, tone: 0.72, w: 1.2, overshoot: 5, seed: 'rad' + k });
    for (let j = 1; ; j++) { const rr = MAIN.rAt(th - j * TURN); if (rr < 9) break; if (p * r > rr) pencilDot(X, PX + ux * rr, PY + uy * rr, { r: 0.5, seed: 'dot' + k + ':' + j, tone: 0.8 }); }
    const d = r + 24 + 10 * Math.abs(ux);
    letterText(X, (r / MM).toFixed(1), PX + ux * d, PY + uy * d + 6, { size: 12, medium: 'pencil', align: 'center', prog: span(t, 1.2 + k * 0.06, 1.34 + k * 0.06), seed: 'num' + k });
  }
  // the constant angle: at every point the curve crosses its radius at ψ, and b = cot ψ. It is
  // measured on the inner turn at 165°, in the free band between turns.
  { const al = 11 * TURN / 24, th = MAIN.th1 - (MAIN.th1 - al) % TURN - TURN, r = MAIN.rAt(th), ux = Math.cos(al), uy = -Math.sin(al), qx = PX + ux * r, qy = PY + uy * r;
    const tx = B_REAL * Math.cos(th) - Math.sin(th), ty = -(B_REAL * Math.sin(th) + Math.cos(th)), tl = Math.hypot(tx, ty), p = span(t, 1.6, 1.95);
    pencilLine(X, PX + ux * (r - 14), PY + uy * (r - 14), PX + ux * (r + 52), PY + uy * (r + 52), { prog: p, tone: 0.65, w: 1.15, overshoot: 3, seed: 'psiR' });
    pencilLine(X, qx - tx / tl * 34, qy - ty / tl * 34, qx + tx / tl * 34, qy + ty / tl * 34, { prog: span(t, 1.68, 2.0), tone: 0.65, w: 1.15, overshoot: 4, seed: 'tan' });
    const ar = -al, at = Math.atan2(ty, tx); let da = at - ar; while (da > Math.PI) da -= TURN; while (da < -Math.PI) da += TURN;

    letterText(X, 'ψ = 79.9°', qx - 28, qy - 2, { size: 12, medium: 'pencil', align: 'right', prog: span(t, 1.84, 2.02), seed: 'psiT' }); }

  N.forEach(([s, z], i) => letterText(X, s, 742, 150 + i * 24, { size: z, medium: 'pencil', prog: span(t, 1.85 + i * 0.1, 2.0 + i * 0.1), seed: 'note' + i }));
  // the trials along the foot: the same rule at other b, the real one ticked
  TRIALS.forEach((q, i) => {
    pencil(X, shift(q.s.pts, q.x, q.y), { seed: 'trial' + i, w: 1.35, tone: 0.95, prog: smooth(1.45 + i * 0.12, 1.8 + i * 0.12, t) });
    letterText(X, 'b = ' + (q.b === B_REAL ? '0.178' : q.b.toFixed(2)), q.cx, 1206, { size: 13, medium: 'pencil', align: 'center', prog: span(t, 1.8 + i * 0.1, 1.98 + i * 0.1), seed: 'tv' + i });
    if (q.b === B_REAL) pencilTick(X, q.cx, 1236, 15, { prog: span(t, 2.1, 2.22), seed: 'tick' });

}
function label(t) {
  const lines = [{ text: 'No. 1', size: 12.5 }, { text: '*{Nautilus pompilius} Linnaeus, 1758', size: 15 }, { text: 'chambered nautilus', size: 12.5 }, { text: 'r = a·e^{bθ},  b ≈ 0.178', size: 12.5 }];
  const w = Math.round(Math.max(...lines.map(l => measureText(l.text, l.size))) + 30);

// ---------- the font sheet: the whole hand at three cap heights, ink then pencil ----------
const SET = ['ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz', '0123456789', `.,:;'"()[]-–—=+−×·/°%^~!?&<>≈√∞′✓`, 'αβγδθλμπρσφψω ΔΣΦ'];
function sheet() {
  const x0 = TX0 + 40, x1 = TX1 - 40; let y = TY0 + 66;
  const note = (s, yy) => letterText(X, s, x0, yy, { size: 12, medium: 'pencil', seed: 'cap' + s, tone: 0.8 });
  for (const size of [40, 20, 13]) {
    note('hand, cap ' + size + ' px', y - size - 12);
    for (const medium of ['ink', 'pencil']) {
      // set every glyph on its own, wrapping at the margin, so each can be read
      let x = x0;
      SET.forEach((row, ri) => {
        for (const ch of row) {
          const w = measureText(ch, size), gap = size * 0.2;

          letterText(X, ch, x, y, { size, medium, seed: 's' + size + medium + ch });

      y += size * 1.45 + (medium === 'ink' ? size * 0.08 : 0);
    }

    const per = Math.floor((x1 - x0) / (TYPE_PITCH * size)), all = SET.join(' ');
    for (let i = 0; i < all.length; i += per) { letterText(X, all.slice(i, i + per), x0, y, { face: 'type', size, seed: 'ty' + size + ':' + i }); y += size * 1.6; }
    letterText(X, 'No. 1  *{Nautilus pompilius} Linnaeus, 1758  r = a·e^{bθ}', x0, y, { face: 'type', size, seed: 'tys' + size }); y += size * 1.6 + 26;
  }
}

function seek(t) {
  t = clamp(t, 0, DUR);
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(CARD, 0, 0);
  if (SHEET) sheet(); else { construction(t); label(t); }
  X.drawImage(FRAME, 0, 0);
  lightFalloff(X);
  glass(X, t);
}
kitStart(async () => { CARD = renderCard({ tone: BLACK ? 'black' : 'white' }); FRAME = renderFrame(); }, seek);
